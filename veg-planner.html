<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOILPEPPER — Vegetable Garden Planner</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#0d1b2a;color:#e0e0d0;padding:15px;max-width:1500px;margin:0 auto;}
h1{text-align:center;color:#c5e1a5;margin-bottom:4px;font-size:1.4em;}
.subtitle{text-align:center;color:rgba(255,255,255,0.5);font-size:0.75em;margin-bottom:10px;}
.main-layout{display:flex;gap:20px;align-items:flex-start;}
.palette{width:220px;flex-shrink:0;position:sticky;top:10px;max-height:85vh;overflow-y:auto;background:#16213e;border:1px solid #2a3a2a;border-radius:10px;padding:10px;}
.palette h3{color:#aed581;font-size:0.85em;margin-bottom:8px;border-bottom:1px solid rgba(255,255,255,0.08);padding-bottom:6px;}
.palette-group{margin-bottom:8px;}
.palette-group h4{font-size:0.65em;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;}
.palette-item{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;margin:2px;border-radius:6px;cursor:grab;font-size:0.65em;border:1px solid rgba(255,255,255,0.1);transition:all .2s;user-select:none;}
.palette-item:hover{transform:scale(1.05);border-color:rgba(129,199,132,0.4);}
.palette-item:active{cursor:grabbing;}
.palette-item .icon{font-size:1em;}

/* Bed groups */
.bed-group{margin-bottom:2px;}
.bed-group-label{font-size:0.55em;color:rgba(255,255,255,0.3);padding:2px 0;letter-spacing:1px;}

.garden{flex:1;display:flex;flex-direction:column;gap:4px;max-width:820px;margin:0 auto;}
.bed-row{display:flex;align-items:center;gap:8px;}
.bed-label{width:50px;font-size:0.55em;color:rgba(255,255,255,0.3);text-align:right;flex-shrink:0;}
.bed{flex:1;min-height:60px;border-radius:6px;padding:4px 6px;display:flex;flex-wrap:wrap;gap:2px;align-items:flex-start;align-content:flex-start;border:2px dashed rgba(255,255,255,0.08);transition:all .2s;position:relative;cursor:pointer;}
.bed.dragover{border-color:#81c784;background:rgba(129,199,132,0.1);}
.bed-tall{background:rgba(27,94,32,0.25);border-color:rgba(27,94,32,0.4);}
.bed-medium{background:rgba(76,175,80,0.2);border-color:rgba(76,175,80,0.35);}
.bed-low{background:rgba(139,195,74,0.15);border-color:rgba(139,195,74,0.3);}
.bed-label-inner{position:absolute;top:2px;right:5px;font-size:0.4em;color:rgba(255,255,255,0.15);}

/* Plant in bed */
.plant-in-bed{display:inline-flex;align-items:center;gap:3px;padding:3px 6px;border-radius:4px;font-size:0.55em;border:1px solid rgba(255,255,255,0.15);cursor:grab;transition:all .2s;position:relative;}
.plant-in-bed:active{cursor:grabbing;}
.plant-in-bed:hover{transform:scale(1.08);z-index:2;}
.plant-in-bed .qty{font-size:0.7em;color:rgba(255,255,255,0.4);margin-left:1px;}
.plant-in-bed .remove-btn{position:absolute;top:-4px;right:-4px;width:12px;height:12px;border-radius:50%;background:rgba(244,67,54,0.6);border:none;color:#fff;font-size:0.4em;cursor:pointer;display:none;align-items:center;justify-content:center;line-height:1;}
.plant-in-bed:hover .remove-btn{display:flex;}
.plant-in-bed .remove-btn:hover{background:rgba(244,67,54,0.9);}

/* Days badge */
.days-badge{font-size:0.7em;padding:1px 5px;border-radius:8px;cursor:pointer;font-weight:600;display:inline-block;line-height:1.4;}

/* Sow/harvest bar in bed view */
.sow-harvest-bar{width:100%;height:4px;border-radius:2px;margin-top:2px;display:flex;overflow:hidden;border-left:1px solid rgba(255,255,255,0.05);}
.sow-harvest-bar .sh-seg{flex:1;border-right:1px solid rgba(255,255,255,0.05);}
.sow-harvest-header{width:100%;display:flex;margin-bottom:1px;border-left:1px solid rgba(255,255,255,0.05);}
.sow-harvest-header .sh-month-label{flex:1;text-align:center;font-size:0.35em;color:rgba(255,255,255,0.25);border-right:1px solid rgba(255,255,255,0.05);line-height:1;padding:1px 0;}
.sow-harvest-header .sh-month-label.current{color:#81c784;font-weight:600;}
.sow-harvest-legend{width:100%;display:flex;gap:8px;font-size:0.35em;color:rgba(255,255,255,0.3);margin-top:3px;justify-content:center;}
.sow-harvest-legend .legend-dot{display:inline-block;width:6px;height:6px;border-radius:1px;margin-right:2px;}

/* Spacing indicator */
.spacing-info{font-size:0.45em;color:rgba(255,255,255,0.2);padding:2px 0;}

/* Info panel */
.info-panel{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(13,27,42,0.95);border:1px solid rgba(255,255,255,0.12);border-radius:8px;padding:10px 16px;z-index:100;display:none;backdrop-filter:blur(4px);max-width:520px;width:90%;}
.info-panel.active{display:block;}
.info-panel h4{color:#c5e1a5;font-size:0.75em;margin-bottom:4px;}
.info-panel p{font-size:0.6em;color:rgba(255,255,255,0.6);line-height:1.4;}
.info-panel .stat{display:inline-block;margin-right:8px;}
.info-panel .sow-harvest-info{font-size:0.6em;line-height:1.6;margin-top:4px;padding-top:4px;border-top:1px solid rgba(255,255,255,0.08);}

/* Date picker popup */
.date-picker-popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#16213e;border:1px solid rgba(255,255,255,0.2);border-radius:10px;padding:16px;z-index:200;display:none;box-shadow:0 4px 20px rgba(0,0,0,0.5);}
.date-picker-popup.active{display:block;}
.date-picker-popup h4{color:#c5e1a5;font-size:0.75em;margin-bottom:8px;}
.date-picker-popup input[type=date]{background:#0d1b2a;border:1px solid rgba(255,255,255,0.2);border-radius:4px;color:#e0e0d0;padding:6px 10px;font-size:0.7em;width:100%;margin-bottom:8px;}
.date-picker-popup .popup-btns{display:flex;gap:6px;justify-content:flex-end;}
.date-picker-popup .popup-btns button{padding:4px 12px;border:1px solid rgba(255,255,255,0.2);border-radius:4px;cursor:pointer;font-size:0.65em;background:rgba(255,255,255,0.05);color:#ccc;}
.date-picker-popup .popup-btns button:hover{background:rgba(255,255,255,0.1);}
.date-picker-popup .popup-btns .btn-set{background:rgba(129,199,132,0.15);border-color:#81c784;color:#c5e1a5;}
.date-picker-popup .popup-btns .btn-set:hover{background:rgba(129,199,132,0.25);}

/* Buttons */
.action-bar{display:flex;gap:6px;margin-top:10px;justify-content:center;flex-wrap:wrap;}
.btn{display:inline-flex;align-items:center;gap:4px;padding:6px 14px;border:1px solid rgba(255,255,255,0.2);border-radius:6px;cursor:pointer;font-size:0.7em;background:rgba(255,255,255,0.05);color:#ccc;transition:all .2s;}
.btn:hover{background:rgba(255,255,255,0.1);}
.btn-primary{background:rgba(129,199,132,0.15);border-color:#81c784;color:#c5e1a5;}
.btn-primary:hover{background:rgba(129,199,132,0.25);}
.btn-danger{background:rgba(244,67,54,0.15);border-color:rgba(244,67,54,0.4);color:#ef5350;}
.btn-danger:hover{background:rgba(244,67,54,0.25);}
.btn.active-toggle{background:rgba(129,199,132,0.2);border-color:#81c784;color:#c5e1a5;}

/* Calendar view */
.calendar-view{display:none;width:100%;}
.calendar-view.active{display:block;}
.calendar-grid{width:100%;border-collapse:collapse;font-size:0.55em;}
.calendar-grid th{text-align:center;padding:4px 2px;font-weight:400;color:rgba(255,255,255,0.5);border-bottom:1px solid rgba(255,255,255,0.1);font-size:0.9em;}
.calendar-grid td{text-align:center;padding:2px;border:1px solid rgba(255,255,255,0.06);vertical-align:top;min-width:40px;height:32px;position:relative;}
.calendar-grid .bed-label-cell{text-align:right;padding-right:6px;color:rgba(255,255,255,0.3);font-size:0.9em;white-space:nowrap;border:none;width:60px;}
.calendar-grid .month-current{border-color:#81c784;background:rgba(129,199,132,0.08);}
.calendar-grid .cell-sow{background:rgba(129,199,132,0.2);}
.calendar-grid .cell-harvest{background:rgba(255,213,79,0.2);}
.calendar-grid .cell-both{background:linear-gradient(135deg,rgba(129,199,132,0.25) 0%,rgba(129,199,132,0.25) 50%,rgba(255,213,79,0.25) 50%,rgba(255,213,79,0.25) 100%);}
.calendar-grid .plant-icon{font-size:1em;cursor:pointer;display:inline-block;margin:0 1px;}
.calendar-grid .plant-icon:hover{transform:scale(1.2);}
.calendar-grid .bed-row-label{color:rgba(255,255,255,0.4);font-size:0.85em;}

/* Scrollbar */
.palette::-webkit-scrollbar{width:4px;}
.palette::-webkit-scrollbar-track{background:transparent;}
.palette::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.1);border-radius:2px;}

/* Responsive */

/* ===== Real-world garden model (2026-08-06) ===== */
.garden-setup{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:center;margin:6px auto 10px;padding:8px 14px;background:rgba(13,27,42,0.7);border:1px solid rgba(255,255,255,0.08);border-radius:8px;max-width:820px;font-size:0.7em;}
.garden-setup label{color:rgba(255,255,255,0.5);}
.garden-setup select,.garden-setup input{background:#0d1b2a;border:1px solid rgba(255,255,255,0.2);border-radius:4px;color:#e0e0d0;padding:3px 6px;font-size:0.95em;}
.garden-setup .g-hint{color:rgba(255,255,255,0.35);font-size:0.9em;}
.join-toggle{margin-left:auto;font-size:0.5em;padding:2px 8px;border-radius:6px;border:1px solid rgba(129,199,132,0.4);background:rgba(129,199,132,0.12);color:#81c784;cursor:pointer;flex-shrink:0;}
.join-toggle:hover{background:rgba(129,199,132,0.25);}
.join-toggle.joined{border-color:rgba(255,213,79,0.4);background:rgba(255,213,79,0.1);color:#ffd54f;}
.bed-slot{flex:1;min-height:60px;border-radius:6px;padding:4px 6px;display:flex;flex-wrap:wrap;gap:2px;align-items:flex-start;align-content:flex-start;border:2px dashed rgba(255,255,255,0.08);transition:all .2s;position:relative;cursor:pointer;min-width:0;}
.bed-slot.dragover{border-color:#81c784;background:rgba(129,199,132,0.1);}
.bed-slot .slot-tag{position:absolute;bottom:2px;left:5px;font-size:0.38em;color:rgba(255,255,255,0.22);}
.bed-slot .bed-area{position:absolute;top:2px;left:5px;font-size:0.38em;color:rgba(255,255,255,0.25);}
.bed-joined{flex:1;min-height:60px;border-radius:6px;padding:4px 6px;display:flex;flex-wrap:wrap;gap:2px;align-items:flex-start;align-content:flex-start;border:2px dashed rgba(255,255,255,0.1);transition:all .2s;position:relative;cursor:pointer;min-width:0;}
.bed-joined.dragover{border-color:#81c784;background:rgba(129,199,132,0.1);}
.bed-slot-tall{background:rgba(27,94,32,0.25);border-color:rgba(27,94,32,0.4);}
.bed-slot-medium{background:rgba(76,175,80,0.2);border-color:rgba(76,175,80,0.35);}
.bed-slot-low{background:rgba(139,195,74,0.15);border-color:rgba(139,195,74,0.3);}
.bed-row-module-label{font-size:0.45em;color:rgba(255,255,255,0.25);text-align:center;margin:8px 0 2px;letter-spacing:2px;}
.spec-card{max-width:820px;margin:14px auto;background:rgba(13,27,42,0.8);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:10px 14px;font-size:0.68em;}
.spec-card h4{color:#81c784;margin:0 0 6px;font-size:1.05em;}
.spec-card .spec-grid{display:flex;flex-wrap:wrap;gap:6px 16px;}
.spec-card .spec-item b{color:#e0e0d0;}
.spec-card .spec-note{margin-top:6px;color:rgba(255,255,255,0.4);font-size:0.92em;}
.sow-spec{background:rgba(129,199,132,0.08);border:1px solid rgba(129,199,132,0.25);border-radius:6px;padding:6px 10px;margin:4px 0;font-size:0.85em;}
.sow-spec div{margin:2px 0;color:#c8e6c9;}
.zone-minimap{display:grid;gap:1px;margin:8px auto 0;width:min(280px,90%);}
.zone-minimap .zm-cell{aspect-ratio:1;border-radius:2px;background:rgba(255,255,255,0.04);}
.zone-minimap .zm-cell.block{background:rgba(129,199,132,0.35);border:1px solid rgba(129,199,132,0.5);}

@media(max-width:700px){.main-layout{flex-direction:column;}.palette{width:100%;position:static;max-height:none;flex-direction:row;flex-wrap:wrap;}.palette h3{width:100%;}.palette-group{display:inline;}.palette-group h4{display:inline;margin-right:4px;}.bed-row{flex-direction:column;}.bed-label{width:auto;text-align:left;}.calendar-grid{font-size:0.45em;}.calendar-grid td{min-width:28px;}}
</style>
</head>
<body>
<!-- DESIGN BRIEF STRIP (shared reader — injected by design-brief system) -->
<script>
(function () {
  // Shared design brief from Master Plan (tuscan-brief-v1). Static tools only
  // READ it — they never write. Falls back to sensible Tuscan defaults.
  var KEY = 'tuscan-brief-v1';
  var DEF = {
    region: 'tuscany', title: 'Tuscan hillside',
    plotW: 100, plotH: 100, cellSize: 10,
    defaultSoil: 'silty', altitude: 300, climateZone: '8b-9a',
    aspect: 'South (180°)', slope: '~10% moderate'
  };
  var b = DEF;
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) { var p = JSON.parse(raw); for (var k in DEF) if (p[k] !== undefined) b[k] = p[k]; }
  } catch (e) {}

  var soilLbl = { sandy: 'Sandy', silty: 'Silty', loam: 'Loam', clay: 'Clay', chalky: 'Chalky', peaty: 'Peaty' }[b.defaultSoil] || b.defaultSoil;
  var regionLbl = b.region === 'netherlands' ? 'Netherlands' : 'Tuscany';

  // Build the strip
  var strip = document.createElement('div');
  strip.style.cssText = 'display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;align-items:center;' +
    'background:#142114;border:1px solid #1a301a;border-radius:6px;padding:6px 12px;margin:0 auto 12px;' +
    'max-width:900px;font-size:0.72rem;color:#a8b8a0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;';
  var parts = [
    '<span style="color:#c4a040;font-weight:600">' + (b.title || 'Design') + '</span>',
    '<span>' + regionLbl + '</span>',
    '<span>' + b.plotW + '×' + b.plotH + 'm · ' + b.cellSize + 'm cells</span>',
    '<span>' + soilLbl + ' soil</span>',
    '<span>~' + b.altitude + 'm</span>',
    '<span>Zone ' + b.climateZone + '</span>',
    '<span>' + b.aspect + '</span>',
    '<span>' + b.slope + '</span>',
    '<a href="master-plan.html?region=' + b.region + '" style="color:#5a8a4a;text-decoration:none;font-weight:600">⚙️ ' + (b.region === 'netherlands' ? 'Bewerken in Master Plan' : 'Edit in Master Plan') + '</a>'
  ];
  strip.innerHTML = parts.join('<span style="opacity:0.4">·</span>');
  var body = document.body;
  body.insertBefore(strip, body.firstChild);

  // Sector Analysis: prefill params from the brief once the page is ready
  // (one-way: brief is the source of truth; user can still override locally)
  function prefillSectorParams() {
    // Aspect: match degrees (e.g. "South (180°)" → 180) to the select options
    var aspEl = document.getElementById('aspect');
    if (aspEl && b.aspect) {
      var mDeg = String(b.aspect).match(/(\d+)/);
      var deg = mDeg ? parseInt(mDeg[1], 10) : NaN;
      if (!isNaN(deg)) {
        for (var i = 0; i < aspEl.options.length; i++) {
          if (parseInt(aspEl.options[i].value, 10) === deg) { aspEl.value = aspEl.options[i].value; break; }
        }
      }
    }
    // Altitude: brief value → number input
    var altEl = document.getElementById('altitude');
    if (altEl && b.altitude) {
      altEl.value = b.altitude;
      if (typeof updateSectors === 'function') updateSectors();
    }
    // Slope: match brief slope % to the select options
    var slEl = document.getElementById('slope');
    if (slEl && b.slope) {
      var mSl = String(b.slope).match(/(\d+)/);
      var sl = mSl ? parseInt(mSl[1], 10) : NaN;
      if (!isNaN(sl)) {
        for (var i = 0; i < slEl.options.length; i++) {
          if (parseInt(slEl.options[i].value, 10) === sl) { slEl.value = slEl.options[i].value; break; }
        }
      }
    }
    // Live "Modular Parameters" reference table (if present)
    var pAsp = document.getElementById('param-aspect');
    if (pAsp && b.aspect) pAsp.textContent = b.aspect;
    var pAlt = document.getElementById('param-altitude');
    if (pAlt && b.altitude) pAlt.textContent = b.altitude + 'm';
    var pSl = document.getElementById('param-slope');
    if (pSl && b.slope) {
      var mP = String(b.slope).match(/(\d+)/);
      pSl.textContent = (mP ? mP[1] : b.slope) + '%';
    }
    // Live summary sentence + sun stats (if present)
    var facing = function (deg) {
      var d = parseInt(deg, 10);
      if (d >= 315 || d < 45) return 'north-facing';
      if (d >= 45 && d < 135) return 'east-facing';
      if (d >= 135 && d < 225) return 'south-facing';
      return 'west-facing';
    };
    var sumAlt = document.getElementById('sum-altitude');
    if (sumAlt && b.altitude) sumAlt.textContent = '~' + b.altitude + 'm';
    var sumReg = document.getElementById('sum-region');
    if (sumReg) sumReg.textContent = b.region === 'netherlands' ? 'the Netherlands' : 'Tuscany';
    var sumAsp = document.getElementById('sum-aspect');
    if (sumAsp && b.aspect) {
      var dA = String(b.aspect).match(/(\d+)/);
      if (dA) sumAsp.textContent = facing(dA[1]);
    }
    var latEl2 = document.getElementById('lat');
    var latVal = latEl2 ? (parseFloat(latEl2.value) || 43) : 43;
    var stLat = document.getElementById('st-lat');
    if (stLat) stLat.textContent = Math.round(latVal) + '°N';
    var stSum = document.getElementById('st-summer');
    if (stSum) stSum.textContent = Math.round((90 - latVal + 23.44) * 10) / 10 + '°';
    var stWin = document.getElementById('st-winter');
    if (stWin) stWin.textContent = Math.round((90 - latVal - 23.44) * 10) / 10 + '°';
    var stAsp = document.getElementById('st-aspect');
    if (stAsp && b.aspect) {
      var dA2 = String(b.aspect).match(/(\d+)/);
      if (dA2) stAsp.textContent = facing(dA2[1]);
    }
    // Water Management: plot size + altitude in subtitle (if present)
    var wmPlot = document.getElementById('wm-plot');
    if (wmPlot && b.plotW && b.plotH) {
      var ha = (b.plotW * b.plotH) / 10000;
      wmPlot.textContent = (ha >= 1 ? (Math.round(ha * 10) / 10) + ' ha' : Math.round(b.plotW * b.plotH) + ' m²');
    }
    var wmAlt = document.getElementById('wm-alt');
    if (wmAlt && b.altitude) wmAlt.textContent = '~' + b.altitude + 'm altitude';
    // Design Proposal: Site Overview body from the brief (if present)
    var dpAlt = document.getElementById('dp-alt');
    if (dpAlt && b.altitude) dpAlt.textContent = b.altitude;
    var dpZone = document.getElementById('dp-zone');
    if (dpZone && b.climateZone) dpZone.textContent = b.climateZone;
    var dpArea = document.getElementById('dp-area');
    if (dpArea && b.plotW && b.plotH) {
      var dpHa = (b.plotW * b.plotH) / 10000;
      dpArea.textContent = (dpHa >= 1 ? dpHa + ' hectares' : Math.round(b.plotW * b.plotH) + ' m²') + ' (' + b.plotW + '×' + b.plotH + 'm)';
    }
    var dpRain = document.getElementById('dp-rain');
    var waterForRain = null;
    try { waterForRain = JSON.parse(localStorage.getItem('tuscan-water-v1') || 'null'); } catch (e) {}
    if (dpRain && waterForRain && waterForRain.rainfall) dpRain.textContent = waterForRain.rainfall;
    // Summary cards: site area + swales
    var cardArea = document.getElementById('card-area');
    if (cardArea && b.plotW && b.plotH) {
      var cHa = (b.plotW * b.plotH) / 10000;
      cardArea.textContent = (cHa >= 1 ? cHa + ' ha' : Math.round(b.plotW * b.plotH) + ' m²');
    }
    var cardSwales = document.getElementById('card-swales');
    if (cardSwales && waterForRain && waterForRain.swales) cardSwales.textContent = waterForRain.swales;
    // Subtitle (top of page): area, altitude, zone, location
    var subArea = document.getElementById('sub-area');
    if (subArea && b.plotW && b.plotH) {
      var sHa = (b.plotW * b.plotH) / 10000;
      subArea.textContent = (sHa >= 1 ? sHa + 'ha Hillside' : Math.round(b.plotW * b.plotH) + 'm² Site');
    }
    var subAlt = document.getElementById('sub-alt');
    if (subAlt && b.altitude) subAlt.textContent = b.altitude;
    var subZone = document.getElementById('sub-zone');
    if (subZone && b.climateZone) subZone.textContent = b.climateZone;
    var subLoc = document.getElementById('sub-loc');
    if (subLoc) subLoc.textContent = b.region === 'netherlands' ? 'Netherlands' : 'Tuscany, Italy';
    if (typeof updateSectors === 'function') updateSectors();
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', prefillSectorParams);
  } else {
    prefillSectorParams();
  }
})();
</script>

  }
};
function tt(k) { return (T[LANG] && T[LANG][k] !== undefined) ? T[LANG][k] : (T.en[k] !== undefined ? T.en[k] : k); }
function mName(m) { return T[LANG].months[m-1] || ''; }
function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(function(el) {
    var key = el.getAttribute('data-i18n');
    if (T[LANG][key] !== undefined) {
      if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') el.placeholder = T[LANG][key];
      else el.textContent = T[LANG][key];
    }
  });
}

const MONTHS_SHORT = ['J','F','M','A','M','J','J','A','S','O','N','D'];
const MONTHS_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

// ============ STATE (real-world garden model) ============
// Module = 6 rows across one 10m cell. Each row has 2 slots (one per cell,
// 10m each). Joined rows = one 20m bed (two cells). Bed width 0.75m.
// Path width computed: (cell - rows*bedWidth)/rows ≈ 0.92m.
let gardenCfg = {
  modules: 2,        // 1..3  → 6 / 12 / 18 rows
  rowsPerModule: 6,
  bedWidth: 0.75,    // m
  slotLen: 10        // m per slot (= one cell)
};
// rows[r] = { joined: bool, slots: [[plants...],[plants...]] }
let rows = [];
let showCalendar = false;
let showSowHarvest = false;
let datePickerTarget = null; // {rowIndex, slotIndex, plantIndex}

function rowCount() { return gardenCfg.modules * gardenCfg.rowsPerModule; }
function rowName(r) {
  const m = Math.floor(r / gardenCfg.rowsPerModule) + 1;
  const l = 'ABCDEF'[r % gardenCfg.rowsPerModule];
  return 'M' + m + '-' + l;
}
function rowType(r) { const pat = ['tall','low','medium','low','tall','low']; return pat[r % gardenCfg.rowsPerModule]; }
function rowLengthM(r) { return rows[r] && rows[r].joined ? gardenCfg.slotLen * 2 : gardenCfg.slotLen; }
function rowAreaM2(r) { return gardenCfg.bedWidth * rowLengthM(r); }
function pathWidthM() {
  return (gardenCfg.slotLen - gardenCfg.rowsPerModule * gardenCfg.bedWidth) / gardenCfg.rowsPerModule;
}
function initRows() {
  rows = [];
  for (let r = 0; r < rowCount(); r++) rows.push({ joined: false, slots: [[], []] });
}

// ============ HELPERS ============
function todayStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function saveLocalStorage() {
  try {
    localStorage.setItem('tuscanVegGarden', JSON.stringify({version:3, cfg: gardenCfg, rows: rows}));
  } catch(e) {}
}

function normPlant(item) {
  if (typeof item === 'string') return {key: item, plantedDate: todayStr()};
  if (item && typeof item === 'object' && item.key) return {key: item.key, plantedDate: item.plantedDate || todayStr()};
  return null;
}

function loadLocalStorage() {
  try {
    const data = JSON.parse(localStorage.getItem('tuscanVegGarden'));
    if (!data) return false;
    if (data.version === 3 && Array.isArray(data.rows)) {
      gardenCfg = Object.assign(gardenCfg, data.cfg || {});
      // clamp config to sane bounds
      gardenCfg.modules = Math.max(1, Math.min(3, gardenCfg.modules || 2));
      gardenCfg.bedWidth = Math.max(0.5, Math.min(1.2, gardenCfg.bedWidth || 0.75));
      gardenCfg.slotLen = Math.max(5, Math.min(20, gardenCfg.slotLen || 10));
      rows = [];
      for (let r = 0; r < rowCount(); r++) {
        const src = data.rows[r] || {joined: false, slots: [[], []]};
        rows.push({
          joined: !!src.joined,
          slots: [
            (src.slots && src.slots[0] ? src.slots[0].map(normPlant).filter(Boolean) : []),
            (src.slots && src.slots[1] ? src.slots[1].map(normPlant).filter(Boolean) : [])
          ]
        });
      }
      return true;
    }
    if (data.beds && data.beds.length >= 6) {
      // v2 migration: flat 12 beds → 2 modules; each old bed becomes a joined row (slot A)
      gardenCfg.modules = Math.max(1, Math.min(3, Math.ceil(data.beds.length / 6)));
      gardenCfg.bedWidth = 0.75;
      gardenCfg.slotLen = 10;
      rows = [];
      for (let r = 0; r < rowCount(); r++) {
        const old = data.beds[r] || [];
        rows.push({joined: true, slots: [old.map(normPlant).filter(Boolean), []]});
      }
      return true;
    }
  } catch(e) {}
  return false;
}

function getDaysSince(dateStr) {
  if (!dateStr) return 0;
  const d = new Date(dateStr);
  const now = new Date();
  return Math.floor((now - d) / (1000 * 60 * 60 * 24));
}

function getDaysColor(days, daysToMaturity) {
  if (daysToMaturity <= 0) return '#81c784';
  const pct = days / daysToMaturity;
  if (pct <= 0.5) return '#81c784'; // green
  if (pct <= 1.0) return '#ffd54f'; // yellow
  return '#ef5350'; // red
}

function formatMonthRange(months) {
  if (!months || months.length === 0) return '—';
  const sorted = [...months].sort((a,b) => a-b);
  const ranges = [];
  let start = sorted[0], end = sorted[0];
  for (let i = 1; i <= sorted.length; i++) {
    if (sorted[i] === end + 1) {
      end = sorted[i];
    } else {
      ranges.push(start === end ? mName(start) : mName(start) + '–' + mName(end));
      start = sorted[i];
      end = sorted[i];
    }
  }
  return ranges.join(', ');
}

// ============ RENDERING ============
function render() {
  renderPalette();
  saveLocalStorage();
  renderGardenSpec();
  if (showCalendar) {
    renderCalendar();
    document.getElementById('beds-container').style.display = 'none';
    document.getElementById('calendar-container').classList.add('active');
  } else {
    renderBeds();
    document.getElementById('beds-container').style.display = '';
    document.getElementById('calendar-container').classList.remove('active');
  }
}

function renderPalette() {
  const container = document.getElementById('palette-content');
  container.innerHTML = '';
  const cats = LANG === 'nl' ? CATEGORIES_NL : CATEGORIES;
  for (const [catKey, cat] of Object.entries(cats)) {
    const group = document.createElement('div');
    group.className = 'palette-group';
    const h4 = document.createElement('h4');
    h4.textContent = cat.label;
    group.appendChild(h4);
    for (const [key, plant] of Object.entries(PLANTS)) {
      if (plant.category !== catKey) continue;
      const el = document.createElement('div');
      el.className = 'palette-item';
      el.draggable = true;
      el.innerHTML = `<span class="icon">${plant.icon}</span> ${plant.name}`;
      el.dataset.plantKey = key;
      el.ondragstart = function(e) {
        e.dataTransfer.setData('text/plain', key);
        e.dataTransfer.effectAllowed = 'copy';
        setTimeout(() => this.style.opacity = '0.5', 0);
      };
      el.ondragend = function() { this.style.opacity = '1'; };
      el.ondblclick = function() {
        const key = this.dataset.plantKey;
        const type = PLANTS[key].category;
        for (let r = 0; r < rows.length; r++) {
          if (rowType(r) === type) {
            rows[r].slots[0].push({key: key, plantedDate: todayStr()});
            render();
            showInfo(LANG === 'nl' ? `Toegevoegd ${PLANTS[key].name} aan rij ${rowName(r)}` : `Added ${PLANTS[key].name} to row ${rowName(r)}`);
            return;
          }
        }
        rows[0].slots[0].push({key: key, plantedDate: todayStr()});
        render();
      };
      group.appendChild(el);
    }
    container.appendChild(group);
  }
}

function makePlantEl(r, s, j, obj) {
  const key = typeof obj === 'string' ? obj : obj.key;
  const plantedDate = typeof obj === 'string' ? todayStr() : (obj.plantedDate || todayStr());
  const plant = PLANTS[key];
  if (!plant) return null;
  const el = document.createElement('div');
  el.className = 'plant-in-bed';
  el.draggable = true;
  const days = getDaysSince(plantedDate);
  const badgeColor = getDaysColor(days, plant.daysToMaturity || 0);
  const badgeHtml = `<span class="days-badge" style="background:${badgeColor};color:#0d1b2a;" onclick="event.stopPropagation();openDatePicker(${r},${s},${j})" title="Click to set planted date">${days} days</span>`;
  el.innerHTML = `${plant.icon} ${plant.name} ${badgeHtml} <span class="remove-btn" onclick="event.stopPropagation();removePlant(${r},${s},${j})">✕</span>`;
  el.ondragstart = function(e) {
    e.dataTransfer.setData('text/plain', key);
    e.dataTransfer.setData('application/row-index', String(r));
    e.dataTransfer.setData('application/slot-index', String(s));
    e.dataTransfer.setData('application/plant-index', String(j));
    e.dataTransfer.effectAllowed = 'move';
  };
  el.ondragend = function() {};
  el.onclick = function(e) {
    if (e.target.classList.contains('remove-btn') || e.target.classList.contains('days-badge')) return;
    showPlantInfo(key, plantedDate);
  };
  if (showSowHarvest && plant.sowMonths && plant.harvestMonths) {
    const bar = document.createElement('div');
    bar.className = 'sow-harvest-bar';
    const allMonths = new Set([...plant.sowMonths, ...plant.harvestMonths]);
    if (allMonths.size > 0) {
      for (let m = 1; m <= 12; m++) {
        const seg = document.createElement('div');
        seg.className = 'sh-seg';
        const isSow = plant.sowMonths.includes(m);
        const isHarvest = plant.harvestMonths.includes(m);
        if (isSow && isHarvest) {
          seg.style.cssText = `flex:1;background:linear-gradient(90deg,rgba(129,199,132,0.5) 0%,rgba(255,213,79,0.5) 100%);border-right:1px solid rgba(255,255,255,0.05);`;
        } else if (isSow) {
          seg.style.cssText = `flex:1;background:rgba(129,199,132,0.5);border-right:1px solid rgba(255,255,255,0.05);`;
        } else if (isHarvest) {
          seg.style.cssText = `flex:1;background:rgba(255,213,79,0.5);border-right:1px solid rgba(255,255,255,0.05);`;
        } else {
          seg.style.cssText = `flex:1;background:transparent;border-right:1px solid rgba(255,255,255,0.05);`;
        }
        bar.appendChild(seg);
      }
    }
    el.appendChild(bar);
  }
  return el;
}

function setupDropTarget(el, r, s) {
  el.ondragover = function(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; this.classList.add('dragover'); };
  el.ondragleave = function() { this.classList.remove('dragover'); };
  el.ondrop = function(e) {
    e.preventDefault();
    this.classList.remove('dragover');
    const key = e.dataTransfer.getData('text/plain');
    if (!key) return;
    const srcRowStr = e.dataTransfer.getData('application/row-index');
    if (srcRowStr !== '') {
      const srcR = parseInt(srcRowStr);
      const srcS = parseInt(e.dataTransfer.getData('application/slot-index'));
      const srcP = parseInt(e.dataTransfer.getData('application/plant-index'));
      if (srcR >= 0 && srcR < rows.length && srcS >= 0 && srcS <= 1 &&
          srcP >= 0 && srcP < rows[srcR].slots[srcS].length) {
        const obj = rows[srcR].slots[srcS].splice(srcP, 1)[0];
        rows[r].slots[s].push(obj);
        render();
        showInfo(LANG === 'nl' ? `Verplaatst ${PLANTS[obj.key] ? PLANTS[obj.key].name : obj.key} naar ${rowName(r)}` : `Moved ${PLANTS[obj.key] ? PLANTS[obj.key].name : obj.key} to ${rowName(r)}`);
      }
    } else if (PLANTS[key]) {
      rows[r].slots[s].push({key: key, plantedDate: todayStr()});
      render();
      showInfo(LANG === 'nl' ? `Toegevoegd ${PLANTS[key].name} aan ${rowName(r)}` : `Added ${PLANTS[key].name} to ${rowName(r)}`);
    }
  };
}

function renderBeds() {
  const container = document.getElementById('beds-container');
  container.innerHTML = '';
  const pathM = pathWidthM();
  let lastModule = -1;

  for (let r = 0; r < rows.length; r++) {
    const mod = Math.floor(r / gardenCfg.rowsPerModule);
    const type = rowType(r);
    const name = rowName(r);
    const joined = rows[r].joined;

    // Module separator label
    if (mod !== lastModule) {
      const modLabel = document.createElement('div');
      modLabel.className = 'bed-row-module-label';
      modLabel.textContent = `▍${tt('module')} ${mod + 1} — ${gardenCfg.rowsPerModule} ${tt('rows')} · ${gardenCfg.slotLen}m × ${gardenCfg.slotLen}m ${tt('cell')} · ${tt('paths')} ${(pathM * 100).toFixed(0)}cm`;
      container.appendChild(modLabel);
      lastModule = mod;
    }

    const row = document.createElement('div');
    row.className = 'bed-row';

    // Label + join toggle
    const label = document.createElement('div');
    label.className = 'bed-label';
    label.textContent = `${name} · ${tt(type)}`;
    row.appendChild(label);

    const joinBtn = document.createElement('button');
    joinBtn.className = 'join-toggle' + (joined ? ' joined' : '');
    joinBtn.textContent = joined ? ('🔗 20m ' + tt('joined')) : tt('splitBtn');
    joinBtn.title = joined ? tt('splitTitle') : tt('joinTitle');
    joinBtn.onclick = function() { toggleJoin(r); };
    row.appendChild(joinBtn);

    if (joined) {
      // One 20m bed (both slots merge visually; plants kept in slot 0)
      const bed = document.createElement('div');
      bed.className = `bed-joined bed-slot-${type}`;
      const area = document.createElement('div');
      area.className = 'bed-area';
      const cap = slotCapacity(r, 0);
      area.textContent = `20m · ${rowAreaM2(r).toFixed(1)} m²` + (cap ? ` · ≈${cap}/${tt('capacityBed')}` : '');
      bed.appendChild(area);
      const spacer = document.createElement('div');
      spacer.style.cssText = 'width:100%;height:14px;';
      bed.appendChild(spacer);
      setupDropTarget(bed, r, 0);
      const plants = (rows[r].slots[0] || []).concat(rows[r].slots[1] || []);
      for (let j = 0; j < plants.length; j++) {
        const el = makePlantEl(r, j < rows[r].slots[0].length ? 0 : 1, j < rows[r].slots[0].length ? j : j - rows[r].slots[0].length, plants[j]);
        if (el) bed.appendChild(el);
      }
      if (showSowHarvest && plants.length > 0) {
        const legend = document.createElement('div');
        legend.className = 'sow-harvest-legend';
        legend.innerHTML = `<span><span class="legend-dot" style="background:rgba(129,199,132,0.5);"></span>${tt('sow')}</span><span><span class="legend-dot" style="background:rgba(255,213,79,0.5);"></span>${tt('harvest')}</span><span><span class="legend-dot" style="background:linear-gradient(90deg,rgba(129,199,132,0.5) 0%,rgba(255,213,79,0.5) 100%);"></span>${tt('both')}</span>`;
        bed.appendChild(legend);
      }
      row.appendChild(bed);
    } else {
      // Two 10m beds (slots 0 and 1)
      for (let s = 0; s < 2; s++) {
        const bed = document.createElement('div');
        bed.className = `bed-slot bed-slot-${type}`;
        const area = document.createElement('div');
        area.className = 'bed-area';
        const cap = slotCapacity(r, s);
        area.textContent = `${gardenCfg.slotLen}m · ${rowAreaM2(r).toFixed(1)} m²` + (cap ? ` · ≈${cap}` : '');
        bed.appendChild(area);
        const tag = document.createElement('div');
        tag.className = 'slot-tag';
        tag.textContent = s === 0 ? 'A' : 'B';
        bed.appendChild(tag);
        const spacer = document.createElement('div');
        spacer.style.cssText = 'width:100%;height:14px;';
        bed.appendChild(spacer);
        setupDropTarget(bed, r, s);
        const plants = rows[r].slots[s] || [];
        for (let j = 0; j < plants.length; j++) {
          const el = makePlantEl(r, s, j, plants[j]);
          if (el) bed.appendChild(el);
        }
        if (showSowHarvest && plants.length > 0) {
          const legend = document.createElement('div');
          legend.className = 'sow-harvest-legend';
          legend.innerHTML = `<span><span class="legend-dot" style="background:rgba(129,199,132,0.5);"></span>${tt('sow')}</span><span><span class="legend-dot" style="background:rgba(255,213,79,0.5);"></span>${tt('harvest')}</span>`;
          bed.appendChild(legend);
        }
        row.appendChild(bed);
      }
    }

    container.appendChild(row);
  }
}

function toggleJoin(r) {
  const row = rows[r];
  if (row.joined) {
    row.joined = false;
  } else {
    // merge slot B into A, then clear B
    row.slots[0] = (row.slots[0] || []).concat(row.slots[1] || []);
    row.slots[1] = [];
    row.joined = true;
  }
  render();
  renderGardenSpec();
  showInfo(row.joined ? `${rowName(r)} joined → one 20m bed` : `${rowName(r)} split → two 10m beds`);
}

// ============ CALENDAR VIEW ============
function renderCalendar() {
  const container = document.getElementById('calendar-container');
  const now = new Date();
  const currentMonth = now.getMonth() + 1;

  let html = '<table class="calendar-grid"><thead><tr><th class="bed-label-cell"></th>';
  for (let m = 1; m <= 12; m++) {
    html += `<th${m === currentMonth ? ' style="color:#81c784;font-weight:600;"' : ''}>${MONTHS_SHORT[m-1]}</th>`;
  }
  html += '</tr></thead><tbody>';

  for (let i = 0; i < rows.length; i++) {
    const type = rowType(i);
    const name = rowName(i);
    const plants = (rows[i].slots[0] || []).concat(rows[i].slots[1] || []);
    const suffix = rows[i].joined ? ' · 20m' : ' · 2×10m';

    html += `<tr><td class="bed-label-cell"><span class="bed-row-label">${name}${suffix}</span></td>`;

    for (let m = 1; m <= 12; m++) {
      let cellClass = '';
      let icons = '';

      for (const obj of plants) {
        const key = typeof obj === 'string' ? obj : obj.key;
        const plant = PLANTS[key];
        if (!plant) continue;

        const isSow = plant.sowMonths && plant.sowMonths.includes(m);
        const isHarvest = plant.harvestMonths && plant.harvestMonths.includes(m);

        if (isSow || isHarvest) {
          icons += `<span class="plant-icon" onclick="showPlantInfo('${key}')" title="${plant.name}">${plant.icon}</span>`;
        }

        if (isSow && isHarvest) {
          if (cellClass !== 'cell-both') cellClass = 'cell-both';
        } else if (isSow) {
          if (cellClass !== 'cell-both') cellClass = 'cell-sow';
        } else if (isHarvest) {
          if (cellClass !== 'cell-both') cellClass = 'cell-harvest';
        }
      }

      if (m === currentMonth) {
        cellClass += ' month-current';
      }

      html += `<td class="${cellClass}">${icons}</td>`;
    }

    html += '</tr>';
  }

  html += '</tbody></table>';
  container.innerHTML = html;
}

// ============ PLANT MANAGEMENT ============
function removePlant(r, s, plantIndex) {
  if (rows[r] && rows[r].slots[s]) rows[r].slots[s].splice(plantIndex, 1);
  render();
}

function clearAll() {
  if (!confirm('Clear all beds?')) return;
  initRows();
  render();
  showInfo('All beds cleared');
}

function resetDefault() {
  gardenCfg.modules = 2;
  gardenCfg.bedWidth = 0.75;
  gardenCfg.slotLen = 10;
  initRows();
  const d = todayStr();
  const suggestions = [
    [{key:'tomato',plantedDate:d},{key:'pole-beans',plantedDate:d},{key:'basil',plantedDate:d}],
    [{key:'lettuce',plantedDate:d},{key:'radish',plantedDate:d},{key:'spinach',plantedDate:d}],
    [{key:'cavolo-nero',plantedDate:d},{key:'fennel',plantedDate:d},{key:'peppers',plantedDate:d}],
    [{key:'carrots',plantedDate:d},{key:'onions',plantedDate:d},{key:'garlic-veg',plantedDate:d}],
    [{key:'climbing-cucumber',plantedDate:d},{key:'sunflower',plantedDate:d}],
    [{key:'strawberry-veg',plantedDate:d},{key:'parsley',plantedDate:d}],
    [{key:'swiss-chard',plantedDate:d},{key:'broccoli',plantedDate:d},{key:'eggplant',plantedDate:d}],
    [{key:'radicchio',plantedDate:d},{key:'beets',plantedDate:d},{key:'cilantro',plantedDate:d}],
    [{key:'corn',plantedDate:d},{key:'pole-beans',plantedDate:d}],
    [{key:'chives-veg',plantedDate:d},{key:'lettuce',plantedDate:d}],
    [{key:'artichoke',plantedDate:d},{key:'kale',plantedDate:d},{key:'fennel',plantedDate:d}],
    [{key:'carrots',plantedDate:d},{key:'radish',plantedDate:d},{key:'onions',plantedDate:d}]
  ];
  for (let i = 0; i < rows.length; i++) {
    rows[i].slots[0] = (suggestions[i % suggestions.length] || []).map(p => ({...p}));
  }
  render();
  renderGardenSpec();
  syncSetupUI();
  showInfo(tt('defaultLoaded'));
}

function sowingSpecHtml(plant) {
  if (!plant || !plant.sowPattern) return '';
  const pat = plant.sowPattern;
  let h = '<div class="sow-spec">';
  const patLbl = { square: tt('patSquare'), diamond: tt('patDiamond'), row: tt('patRow'), hill: tt('patHill') }[pat] || pat;
  if (pat === 'hill') {
    h += `<div>📍 <b>${patLbl}</b> — ${plant.seedsPerHole || 2} ${tt('seedsPerHole')} · ${tt('holes')} ${plant.seedSpacing}cm ${tt('apart')}</div>`;
    if (plant.rowSpacing) h += `<div>📐 ${tt('rows')} <b>${plant.rowSpacing}cm</b> ${tt('apart')}</div>`;
  } else if (pat === 'square') {
    h += `<div>📍 <b>${patLbl}</b> — ${plant.seedSpacing}×${plant.rowSpacing}cm ${tt('grid')}</div>`;
  } else {
    h += `<div>📍 <b>${patLbl}</b> — ${tt('seeds')} <b>${plant.seedSpacing}cm</b> ${tt('apart')} ${tt('inRow')}</div>`;
    if (plant.rowSpacing) h += `<div>📐 ${tt('rows')} <b>${plant.rowSpacing}cm</b> ${tt('apart')}</div>`;
  }
  if (plant.seedDepth) h += `<div>⛏️ ${tt('sowDeep')} <b>${plant.seedDepth}cm</b></div>`;
  if (plant.thinTo) h += `<div>✂️ ${tt('thinTo')} <b>${plant.thinTo}cm</b> ${tt('betweenPlants')}</div>`;
  const cap = plantSlotCapacity(plant);
  if (cap) h += `<div>🧮 <b>≈${cap} ${tt('plants')}</b> ${tt('capacity')} (7.5 m²)</div>`;
  h += '</div>';
  return h;
}

function showPlantInfo(key, plantedDate) {

  if (!plant) return;

  const content = document.getElementById('info-content');

  let sowHarvestHtml = '';
  if (plant.sowMonths || plant.harvestMonths || plant.daysToMaturity || plant.season) {
    sowHarvestHtml = '<div class="sow-harvest-info">';
    if (plant.sowMonths) sowHarvestHtml += `<div>🌱 <b>${tt('sow')}:</b> ${formatMonthRange(plant.sowMonths)}</div>`;
    if (plant.harvestMonths) sowHarvestHtml += `<div>🥬 <b>${tt('harvest')}:</b> ${formatMonthRange(plant.harvestMonths)}</div>`;
    if (plant.daysToMaturity) {
      sowHarvestHtml += `<div>📅 <b>${plant.daysToMaturity} ${tt('daysToMaturity')}</b>`;
      if (plantedDate) {
        const days = getDaysSince(plantedDate);
        const pct = plant.daysToMaturity > 0 ? Math.round((days / plant.daysToMaturity) * 100) : 0;
        sowHarvestHtml += ` · <span style="color:${getDaysColor(days, plant.daysToMaturity)}">${days} days since planting (${Math.min(pct,100)}%)</span>`;
      }

      sowHarvestHtml += `<div>${seasonIcon} <b>${plant.season.charAt(0).toUpperCase()+plant.season.slice(1)}</b> season crop</div>`;
    }

  }

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function mShort(m) { return T[LANG].months[m-1] || ''; }
function monthRange(months) {
  if (!months || !months.length) return '';
  const s = [...months].sort((a,b)=>a-b);
  let out = [], start = s[0], prev = s[0];
  for (let i = 1; i <= s.length; i++) {
    if (s[i] === prev + 1) { prev = s[i]; continue; }
    out.push(start === prev ? mShort(start) : mShort(start) + '–' + mShort(prev));
    start = s[i]; prev = s[i];
  }
  return out.join(', ');
}

function applyLoadedLayout(data) {
  if (data.version === 3 && Array.isArray(data.rows)) {
    gardenCfg = Object.assign({modules: 2, rowsPerModule: 6, bedWidth: 0.75, slotLen: 10}, data.cfg || {});
    gardenCfg.modules = Math.max(1, Math.min(3, gardenCfg.modules || 2));
    gardenCfg.bedWidth = Math.max(0.5, Math.min(1.2, gardenCfg.bedWidth || 0.75));
    gardenCfg.slotLen = Math.max(5, Math.min(20, gardenCfg.slotLen || 10));
    rows = [];
    for (let r = 0; r < rowCount(); r++) {
      const src = data.rows[r] || {joined: false, slots: [[], []]};
      rows.push({
        joined: !!src.joined,
        slots: [
          (src.slots && src.slots[0] ? src.slots[0].map(normPlant).filter(Boolean) : []),
          (src.slots && src.slots[1] ? src.slots[1].map(normPlant).filter(Boolean) : [])
        ]
      });
    }
    return true;
  }
  if (data.beds && data.beds.length >= 6) {
    // v2 import: flat beds → modules, joined rows
    gardenCfg.modules = Math.max(1, Math.min(3, Math.ceil(data.beds.length / 6)));
    gardenCfg.bedWidth = 0.75;
    gardenCfg.slotLen = 10;
    rows = [];
    for (let r = 0; r < rowCount(); r++) {
      const old = data.beds[r] || [];
      rows.push({joined: true, slots: [old.map(normPlant).filter(Boolean), []]});
    }
    return true;
  }
  return false;
}

function importLayout(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (applyLoadedLayout(data)) {
        render();
        renderGardenSpec();
        syncSetupUI();
        showInfo('Layout imported!');
      } else {
        showInfo('Invalid file format');
      }
    } catch(err) {
      showInfo('Error reading file');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ============ SPEC CARD + ZONE MINIMAP ============
function gardenTotals() {
  let joinedCount = 0, splitCount = 0, growing = 0, planted = 0;
  for (let r = 0; r < rows.length; r++) {
    if (rows[r].joined) joinedCount++;
    else splitCount++;
    growing += rowAreaM2(r);
    planted += (rows[r].slots[0] || []).length + (rows[r].slots[1] || []).length;
  }
  return {joinedCount, splitCount, growing, planted};
}

// Plants that fit in one slot (or joined bed) given the sowing pattern.
// Only meaningful when a slot holds ONE crop — mixed slots return null.
function slotCapacity(r, s) {
  const area = rowAreaM2(r) * 10000;               // cm²
  const plants = (rows[r].slots[s] || []).map(p => typeof p === 'string' ? PLANTS[p] : PLANTS[p.key]).filter(Boolean);
  if (plants.length !== 1) return null;
  const p = plants[0];
  const pat = p.sowPattern || 'square';
  const seed = (p.seedSpacing || p.spacing || 30) / 100;   // m
  const row = (p.rowSpacing || p.spacing || 30) / 100;     // m
  let perM2;
  if (pat === 'hill') perM2 = (p.seedsPerHole || 2) / (seed * row);
  else if (pat === 'diamond') perM2 = 1.155 / (seed * row);   // ~15% denser
  else perM2 = 1 / (seed * row);                              // square & row
  return Math.round(area / 10000 * perM2);
}

// Per-plant capacity in a standard 10m slot (for the info panel).
function plantSlotCapacity(p) {
  if (!p || !p.sowPattern) return null;
  const areaM2 = 10 * 0.75;                                  // 10m slot × 0.75m bed
  const seed = (p.seedSpacing || p.spacing || 30) / 100;
  const row = (p.rowSpacing || p.spacing || 30) / 100;
  let perM2;
  if (p.sowPattern === 'hill') perM2 = (p.seedsPerHole || 2) / (seed * row);
  else if (p.sowPattern === 'diamond') perM2 = 1.155 / (seed * row);
  else perM2 = 1 / (seed * row);
  return Math.round(areaM2 * perM2);
}

function renderGardenSpec() {
  const grid = document.getElementById('garden-spec-grid');
  const note = document.getElementById('garden-spec-note');
  const minimap = document.getElementById('zone-minimap');
  if (!grid) return;
  const pathM = pathWidthM();
  const tot = gardenTotals();
  const blockLenCells = 2;                          // 2 cells along the beds (20m)
  const blockWidCells = gardenCfg.modules;          // modules side by side across width
  const cellsTotal = blockLenCells * blockWidCells;
  const footprintM2 = blockLenCells * blockWidCells * gardenCfg.slotLen * gardenCfg.slotLen;

  grid.innerHTML =
    `<div class="spec-item">🧮 <b>${rows.length} ${tt('rows')}</b> · ${gardenCfg.modules} ${tt('module')}${gardenCfg.modules > 1 ? 's' : ''}</div>` +
    `<div class="spec-item">📏 <b>${gardenCfg.bedWidth}m × ${gardenCfg.slotLen}m</b> ${tt('perSlot')} · ${gardenCfg.bedWidth}m × ${gardenCfg.slotLen * 2}m ${tt('joined')}</div>` +
    `<div class="spec-item">🛤️ <b>~${(pathM * 100).toFixed(0)}cm ${tt('paths')}</b> ${tt('betweenRows')}</div>` +
    `<div class="spec-item">🔗 <b>${tot.joinedCount} ${tt('joined')}</b> (20m) · ✂️ <b>${tot.splitCount} ${tt('split')}</b> (2×10m)</div>` +
    `<div class="spec-item">🌱 <b>${tot.growing.toFixed(0)} m² ${tt('growing')}</b> · ${tot.planted} ${tt('plantsPlaced')}</div>` +
    `<div class="spec-item">📍 <b>${cellsTotal} ${tt('cells')}</b> (${blockLenCells}×${blockWidCells}) · ${footprintM2.toFixed(0)} m² ${tt('footprint')}</div>`;

  note.innerHTML = LANG === 'nl'
    ? `Realistisch model: ${gardenCfg.rowsPerModule} rijen per ${gardenCfg.slotLen}m-cel — bed ${gardenCfg.bedWidth}m + ~${(pathM * 100).toFixed(0)}cm pad. Bedden lopen ${gardenCfg.slotLen * 2}m (2 cellen) bij koppelen. Stel modules, breedte en perceellengte hierboven in.`
    : `Real-world layout: ${gardenCfg.rowsPerModule} rows across each ${gardenCfg.slotLen}m cell — bed ${gardenCfg.bedWidth}m + ~${(pathM * 100).toFixed(0)}cm walk. Beds run ${gardenCfg.slotLen * 2}m (2 cells) when joined. Set modules, width and slot length above.`;

  // Zone minimap: plot grid from brief (default 10×10 cells), block highlighted
  let plotW = 10, plotH = 10;
  try {
    const b = JSON.parse(localStorage.getItem('tuscan-brief-v1') || '{}');
    if (b.plotW && b.plotH && b.cellSize) {
      plotW = Math.max(2, Math.round(b.plotW / b.cellSize));
      plotH = Math.max(2, Math.round(b.plotH / b.cellSize));
    }
  } catch(e) {}
  let cells = '';
  const startR = Math.max(0, plotH - 1 - blockWidCells);  // south edge (bottom)
  const startC = Math.floor((plotW - blockLenCells) / 2);
  for (let rr = 0; rr < plotH; rr++) {
    for (let cc = 0; cc < plotW; cc++) {
      const inBlock = rr >= startR && rr < startR + blockWidCells && cc >= startC && cc < startC + blockLenCells;
      cells += `<div class="zm-cell${inBlock ? ' block' : ''}"></div>`;
    }
  }
  minimap.style.gridTemplateColumns = `repeat(${plotW}, 1fr)`;
  minimap.innerHTML = cells;
  minimap.title = `${tt('zone1Block')}: ${blockLenCells}×${blockWidCells} ${tt('cells')} (${blockLenCells * gardenCfg.slotLen}m × ${blockWidCells * gardenCfg.slotLen}m), ${tt('southEdge')} ${plotW}×${plotH}`;
}

// ============ SETUP PANEL ============
function syncSetupUI() {
  const mSel = document.getElementById('cfg-modules');
  const wInp = document.getElementById('cfg-width');
  const sInp = document.getElementById('cfg-slot');
  if (mSel) mSel.value = String(gardenCfg.modules);
  if (wInp) wInp.value = String(gardenCfg.bedWidth);
  if (sInp) sInp.value = String(gardenCfg.slotLen);
  const hint = document.getElementById('garden-hint');
  if (hint) hint.textContent = `= ${rowCount()} rows · paths ~${(pathWidthM() * 100).toFixed(0)}cm`;
}

function onSetupChange() {
  const mSel = document.getElementById('cfg-modules');
  const wInp = document.getElementById('cfg-width');
  const sInp = document.getElementById('cfg-slot');
  if (!mSel) return;
  const newModules = parseInt(mSel.value, 10) || 2;
  const newWidth = parseFloat(wInp.value) || 0.75;
  const newSlot = parseFloat(sInp.value) || 10;

  // preserve existing plants when growing; trim when shrinking
  const oldRows = rows;
  gardenCfg.modules = Math.max(1, Math.min(3, newModules));
  gardenCfg.bedWidth = Math.max(0.5, Math.min(1.2, newWidth));
  gardenCfg.slotLen = Math.max(5, Math.min(20, newSlot));
  rows = [];
  for (let r = 0; r < rowCount(); r++) {
    if (oldRows[r]) rows.push(oldRows[r]);
    else rows.push({joined: false, slots: [[], []]});
  }
  render();
  renderGardenSpec();
  syncSetupUI();
}

// ============ INIT ============
// Region filter is resolved near the top (URL param → brief fallback).
// Show region badge in subtitle.
if (regionParam === 'tuscany' || regionParam === 'netherlands') {
  var regionBadge = document.createElement('span');
  regionBadge.style.cssText = 'display:inline-block;padding:1px 8px;border-radius:8px;font-size:0.7em;background:rgba(90,138,74,0.15);border:1px solid #5a8a4a;color:#aed581;margin-left:6px';
  regionBadge.textContent = regionParam === 'tuscany' ? '🇮🇹 Tuscany' : '🇳🇱 Netherlands';
  document.querySelector('.subtitle').appendChild(regionBadge);
}

// Setup panel listeners
document.addEventListener('DOMContentLoaded', function() {
  var mSel = document.getElementById('cfg-modules');
  var wInp = document.getElementById('cfg-width');
  var sInp = document.getElementById('cfg-slot');
  if (mSel) mSel.addEventListener('change', onSetupChange);
  if (wInp) wInp.addEventListener('change', onSetupChange);
  if (sInp) sInp.addEventListener('change', onSetupChange);
});

initRows();
renderPalette();
applyI18n();   // Dutch UI when region=netherlands
if (!loadLocalStorage()) {
  resetDefault();
} else {
  render();
  renderGardenSpec();
  syncSetupUI();
}

// ============ LIVE DB REFRESH ============
// Try to load plants.json and rebuild the species DB from the real source.
// Falls back silently to the embedded snapshot (offline / file://).
fetch('plants.json').then(function (r) { return r.json(); }).then(function (db) {
  var live = {};
  Object.keys(db).forEach(function (k) {
    var s = db[k];
    if (PLANT_CATEGORIES.indexOf(s.category) < 0) return;
    if (regionFilter !== 'all' && (!s.regions || s.regions.indexOf(regionFilter) < 0)) return;
    live[k] = s;
  });
  // Only swap if the live DB actually differs (new species, changed fields)
  var changed = Object.keys(live).length !== Object.keys(SPECIES_DB).length;
  if (!changed) {
    var lk = Object.keys(live);
    for (var i = 0; i < lk.length; i++) {
      if (JSON.stringify(live[lk[i]]) !== JSON.stringify(SPECIES_DB[lk[i]])) { changed = true; break; }
    }
  }
  if (!changed) return;
  SPECIES_DB = live;
  buildPlants(regionFilter);
  // Re-render palette + current view; keep the user's bed assignments
  var h3 = document.querySelector('.palette h3');
  if (h3) h3.innerHTML = '🌱 <span data-i18n="palette">Plant Palette</span> (' + Object.keys(PLANTS).length + ' <span data-i18n="species">species</span>)';
  applyI18n();
  renderPalette();
  render();
}).catch(function () { /* offline — keep embedded snapshot */ });
</script>
</body>
