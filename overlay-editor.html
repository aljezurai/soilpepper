<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOILPEPPER — Expert Overlay Editor</title>
<style>
:root{
  --bg:#0f1d16; --panel:#16291f; --panel2:#1c3528; --ink:#e8f0e6; --muted:#9db8a3;
  --green:#3e6a46; --green2:#5a8f63; --accent:#7bc48a; --gold:#f4c92f; --goldb:#d9a800;
  --red:#d98383; --border:#2c4636; --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;min-height:100vh}
header{background:var(--panel);border-bottom:2px solid var(--border);padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
.brand{font-size:1.05em;font-weight:700;letter-spacing:.5px}
.brand span{color:var(--gold)}
.sub{font-size:.75em;color:var(--muted);margin-left:10px;font-weight:400}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{background:var(--green2);color:#fff;border:1px solid var(--green);border-radius:999px;padding:9px 18px;font-size:.85em;cursor:pointer;font-weight:600;transition:.15s}
.btn:hover{background:#4a7a54}
.btn.gold{background:var(--gold);color:#000;border-color:var(--goldb)}
.btn.gold:hover{background:#f8d94e}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn.danger{background:transparent;color:var(--red);border:1px solid var(--red)}
.layout{display:grid;grid-template-columns:300px 1fr;gap:18px;padding:20px;max-width:1400px;margin:0 auto}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.panel h2{font-size:.8em;text-transform:uppercase;letter-spacing:1px;color:var(--accent);padding:14px 16px 8px;border-bottom:1px solid var(--border)}
.search{padding:12px}
.search input{width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:10px 12px;color:var(--ink);font-size:.9em;outline:none}
.search input:focus{border-color:var(--green2)}
.splist{max-height:calc(100vh - 240px);overflow-y:auto}
.spec{display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer;border-bottom:1px solid rgba(44,70,54,.5);transition:.12s}
.spec:hover{background:var(--panel2)}
.spec.active{background:var(--green);border-left:3px solid var(--gold)}
.spec .icon{font-size:1.2em}
.spec .nm{flex:1;font-size:.88em}
.spec .cat{font-size:.66em;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);background:rgba(0,0,0,.3);padding:2px 6px;border-radius:5px}
.spec .has{color:var(--gold);font-size:.8em}
.empty{padding:24px;color:var(--muted);text-align:center;font-size:.85em}
.editor{display:flex;flex-direction:column;min-height:60vh}
.editor-head{padding:18px 20px;border-bottom:1px solid var(--border)}
.editor-head h1{font-size:1.35em;margin-bottom:2px}
.editor-head .latin{font-style:italic;color:var(--muted);font-size:.85em}
.editor-head .cat-badge{display:inline-block;background:var(--green2);border-radius:999px;padding:2px 10px;font-size:.7em;text-transform:uppercase;margin-top:8px}
.editor-body{padding:18px 20px;display:flex;flex-direction:column;gap:16px;overflow-y:auto}
.field label{display:block;font-size:.72em;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:9px 11px;color:var(--ink);font-size:.9em;outline:none;font-family:inherit}
.field textarea{min-height:60px;resize:vertical}
.field input:focus,.field textarea:focus{border-color:var(--green2)}
.tips-box{display:flex;flex-direction:column;gap:8px}
.tip{display:flex;gap:8px;align-items:flex-start}
.tip textarea{flex:1}
.tip .rm{background:none;border:none;color:var(--red);cursor:pointer;font-size:1.1em;padding:6px}
.add-btn{background:none;border:1px dashed var(--green2);color:var(--accent);border-radius:8px;padding:8px;cursor:pointer;font-size:.82em}
.add-btn:hover{background:var(--panel2)}
.connections{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.conn-box{border:1px solid var(--border);border-radius:10px;padding:12px;background:var(--panel2)}
.conn-box h3{font-size:.72em;text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.conn-box.companions h3{color:#7bc48a}
.conn-box.antagonists h3{color:var(--red)}
.conn-search{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--ink);font-size:.82em;outline:none;margin-bottom:8px}
.conn-list{display:flex;flex-wrap:wrap;gap:6px;min-height:34px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--green);color:#fff;border-radius:999px;padding:4px 10px;font-size:.78em}
.chip.antag{background:#7a2f2f}
.chip button{background:none;border:none;color:#fff;cursor:pointer;font-size:1em;line-height:1;opacity:.7}
.chip button:hover{opacity:1}
.results{max-height:180px;overflow-y:auto;border:1px solid var(--border);border-radius:8px;display:none}
.results .r{padding:7px 10px;cursor:pointer;font-size:.8em;border-bottom:1px solid rgba(44,70,54,.4)}
.results .r:hover{background:var(--green)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--gold);color:#000;border-radius:999px;padding:10px 22px;font-size:.85em;font-weight:600;z-index:50;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.4)}
.toast.show{opacity:1}
footer{padding:16px 22px;color:var(--muted);font-size:.72em;text-align:center;border-top:1px solid var(--border)}
.meta-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.expert-box{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:14px}
.expert-box h3{font-size:.72em;text-transform:uppercase;letter-spacing:.8px;color:var(--accent);margin-bottom:10px}
@media(max-width:820px){.layout{grid-template-columns:1fr}.splist{max-height:240px}.connections{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="brand">🌶️ SOIL<span>PEPPER</span><span class="sub">Expert Overlay Editor</span></div>
  <div class="actions">
    <button class="btn ghost" onclick="newLayer()">+ New layer</button>
    <button class="btn" onclick="exportJSON()">⬇ Export overlay</button>
    <button class="btn gold" onclick="saveLocal()">💾 Save draft</button>
  </div>
</header>

<div class="layout">
  <!-- SPECIES LIST -->
  <div class="panel">
    <h2>Species</h2>
    <div class="search"><input id="spSearch" placeholder="Search species…" oninput="renderList(this.value)"></div>
    <div class="splist" id="splist"></div>
  </div>

  <!-- EDITOR -->
  <div class="panel editor">
    <div class="editor-head" id="editorHead" style="display:none">
      <h1 id="ehName"></h1>
      <div class="latin" id="ehLatin"></div>
      <span class="cat-badge" id="ehCat"></span>
    </div>
    <div class="editor-body" id="editorBody" style="display:none">

      <!-- Expert attribution -->
      <div class="expert-box">
        <h3>Expert attribution</h3>
        <div class="meta-row">
          <div class="field"><label>Expert name</label><input id="f_source" placeholder="e.g. A. Rossi"></div>
          <div class="field"><label>Credibility note</label><input id="f_note" placeholder="e.g. 20y Mediterranean food forest"></div>
        </div>
      </div>

      <!-- Tips -->
      <div class="field">
        <label>Field-tested tips <small>(one actionable sentence each)</small></label>
        <div class="tips-box" id="tipsBox"></div>
        <button class="add-btn" onclick="addTip()">+ Add a tip</button>
      </div>

      <!-- Varieties -->
      <div class="field">
        <label>Proven varieties / cultivars</label>
        <div id="varietiesBox"></div>
        <button class="add-btn" onclick="addVariety()">+ Add a variety</button>
      </div>

      <!-- Spacing + soil depth -->
      <div class="meta-row">
        <div class="field"><label>Spacing override (cm)</label><input id="f_spacing" type="number" placeholder="leave blank to keep base"></div>
        <div class="field"><label>Soil depth override (cm)</label><input id="f_soilDepth" type="number" placeholder="leave blank to keep base"></div>
      </div>

      <!-- Connections -->
      <div class="field">
        <label>Connections — tap a species to add it as companion or antagonist</label>
        <div class="connections">
          <div class="conn-box companions">
            <h3>🌿 Companions <small>(strong)</small></h3>
            <input class="conn-search" placeholder="Search species…" oninput="showResults(this.value,'companions')" onfocus="showResults(this.value,'companions')" onblur="hideResults('companions')">
            <div class="conn-list" id="companionsChips"></div>
            <div class="results" id="companionsResults"></div>
          </div>
          <div class="conn-box antagonists">
            <h3>⛔ Antagonists <small>(avoid)</small></h3>
            <input class="conn-search" placeholder="Search species…" oninput="showResults(this.value,'antagonists')" onfocus="showResults(this.value,'antagonists')" onblur="hideResults('antagonists')">
            <div class="conn-list" id="antagonistsChips"></div>
            <div class="results" id="antagonistsResults"></div>
          </div>
        </div>
      </div>

      <!-- Principles -->
      <div class="field">
        <label>Soil mutual benefit <small>(how it helps soil / how soil helps it)</small></label>
        <div class="tips-box" id="principlesBox"></div>
        <button class="add-btn" onclick="addPrinciple()">+ Add a principle</button>
      </div>

      <!-- Cautions -->
      <div class="field">
        <label>Cautions / flags</label>
        <textarea id="f_caution" placeholder="e.g. Allelopathic (juglone) — keep away from sensitive veg"></textarea>
      </div>

    </div>
    <div class="empty" id="editorEmpty">Select a species on the left to start adding expert knowledge.</div>
  </div>
</div>

<footer>Deep-merges over plants.json — the base stays untouched. Export produces an overlay layer keyed by species.</footer>
<div class="toast" id="toast"></div>

/* ===== Editor state ===== */
let currentKey = null;
let overlay = {};   // overlay[currentKey] = {...}
let editing = {};   // current editing buffer

const SPECIES_KEYS = Object.keys(SPECIES_INDEX);

/* ===== List rendering ===== */
function renderList(q){
  q=(q||'').toLowerCase().trim();
  const list=document.getElementById('splist');
  const keys=SPECIES_KEYS.filter(k=>{
    if(!q)return true;
    const s=SPECIES_INDEX[k];
    return (s.name||'').toLowerCase().includes(q)||(s.nameNL||'').toLowerCase().includes(q)||(s.latin||'').toLowerCase().includes(q)||k.includes(q);
  });
  if(!keys.length){list.innerHTML='<div class="empty">No species match.</div>';return;}
  list.innerHTML=keys.map(k=>{
    const s=SPECIES_INDEX[k];
    const has=(overlay[k]&&(Object.keys(overlay[k]).some(f=>f!=='source'&&f!=='note')))?"●":"";
    return `<div class="spec ${k===currentKey?'active':''}" onclick="selectSpecies('${k}')">
      <span class="icon">${s.icon}</span>
      <span class="nm">${s.name||k}</span>
      <span class="cat">${s.category||''}</span>
      <span class="has" title="has overlay data">${has}</span>
    </div>`;
  }).join('');
}

function selectSpecies(key){
  currentKey=key;
  const s=SPECIES_INDEX[key];
  editing=JSON.parse(JSON.stringify(overlay[key]||{}));
  // init sub-objects
  editing.expertTips=editing.expertTips||[];
  editing.expertVarieties=editing.expertVarieties||[];
  editing.guildOverrides=editing.guildOverrides||{companions:[],antagonists:[]};
  editing.principles=editing.principles||[];
  document.getElementById('editorHead').style.display='block';
  document.getElementById('editorBody').style.display='flex';
  document.getElementById('editorEmpty').style.display='none';
  document.getElementById('ehName').textContent=s.icon+' '+s.name;
  document.getElementById('ehLatin').textContent='· '+s.latin+' ·';
  document.getElementById('ehCat').textContent=s.category||'';
  document.getElementById('f_source').value=editing.source||'';
  document.getElementById('f_note').value=editing.note||'';
  document.getElementById('f_spacing').value=editing.spacingOverride||'';
  document.getElementById('f_soilDepth').value=editing.soilDepthOverride||'';
  document.getElementById('f_caution').value=(editing.flags&&editing.flags.caution)||'';
  renderTips();renderVarieties();renderChips();renderPrinciples();
  renderList(document.getElementById('spSearch').value);
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ===== Tips ===== */
function renderTips(){
  const b=document.getElementById('tipsBox');
  b.innerHTML=editing.expertTips.map((t,i)=>`<div class="tip"><textarea placeholder="e.g. Pinch suckers weekly" onchange="editTip(${i},this.value)">${t}</textarea><button class="rm" onclick="delTip(${i})">✕</button></div>`).join('');
}
function addTip(){editing.expertTips.push('');renderTips();}
function editTip(i,v){editing.expertTips[i]=v;markDirty();}
function delTip(i){editing.expertTips.splice(i,1);renderTips();markDirty();}

/* ===== Varieties ===== */
function renderVarieties(){
  const b=document.getElementById('varietiesBox');
  b.innerHTML=editing.expertVarieties.map((v,i)=>`
    <div class="tip">
      <input style="flex:1" placeholder="Variety name" value="${v.name||''}" onchange="editVarietyName(${i},this.value)">
      <input style="flex:1" placeholder="Note (optional)" value="${v.note||''}" onchange="editVarietyNote(${i},this.value)">
      <button class="rm" onclick="delVariety(${i})">✕</button>
    </div>`).join('');
}
function addVariety(){editing.expertVarieties.push({name:'',note:''});renderVarieties();}
function editVarietyName(i,v){editing.expertVarieties[i].name=v;markDirty();}
function editVarietyNote(i,v){editing.expertVarieties[i].note=v;markDirty();}
function delVariety(i){editing.expertVarieties.splice(i,1);renderVarieties();markDirty();}

/* ===== Principles ===== */
function renderPrinciples(){
  const b=document.getElementById('principlesBox');
  b.innerHTML=editing.principles.map((p,i)=>`
    <div class="tip">
      <input style="flex:1" placeholder="Gives to soil (e.g. deep roots aerate clay)" value="${p.gives||''}" onchange="editPrinciple(${i},'gives',this.value)">
      <input style="flex:1" placeholder="Gets from soil (e.g. needs fungal-rich topsoil)" value="${p.gets||''}" onchange="editPrinciple(${i},'gets',this.value)">
      <button class="rm" onclick="delPrinciple(${i})">✕</button>
    </div>`).join('');
}
function addPrinciple(){editing.principles.push({gives:'',gets:''});renderPrinciples();}
function editPrinciple(i,f,v){editing.principles[i][f]=v;markDirty();}
function delPrinciple(i){editing.principles.splice(i,1);renderPrinciples();markDirty();}

/* ===== Connections ===== */
function renderChips(){
  const c=editing.guildOverrides.companions||[];
  const a=editing.guildOverrides.antagonists||[];
  const cg=document.getElementById('companionsChips');
  const ag=document.getElementById('antagonistsChips');
  cg.innerHTML=c.map(k=>`<span class="chip">${SPECIES_INDEX[k]?SPECIES_INDEX[k].icon:''} ${SPECIES_INDEX[k]?SPECIES_INDEX[k].name:k} <button onclick="removeConn('companions','${k}')">✕</button></span>`).join('')||'<span style="color:var(--muted);font-size:.75em">None yet</span>';
  ag.innerHTML=a.map(k=>`<span class="chip antag">${SPECIES_INDEX[k]?SPECIES_INDEX[k].icon:''} ${SPECIES_INDEX[k]?SPECIES_INDEX[k].name:k} <button onclick="removeConn('antagonists','${k}')">✕</button></span>`).join('')||'<span style="color:var(--muted);font-size:.75em">None yet</span>';
}
function showResults(q,type){
  q=(q||'').toLowerCase().trim();
  const box=document.getElementById(type+'Results');
  if(!q){box.style.display='none';return;}
  const keys=SPECIES_KEYS.filter(k=>k!==currentKey && (SPECIES_INDEX[k].name||'').toLowerCase().includes(q)).slice(0,12);
  if(!keys.length){box.style.display='none';return;}
  box.style.display='block';
  box.innerHTML=keys.map(k=>`<div class="r" onmousedown="addConn('${type}','${k}')">${SPECIES_INDEX[k].icon} ${SPECIES_INDEX[k].name} <small style="color:var(--muted)">${SPECIES_INDEX[k].category}</small></div>`).join('');
}
function hideResults(type){setTimeout(()=>{document.getElementById(type+'Results').style.display='none';},150);}
function addConn(type,key){
  const arr=editing.guildOverrides[type];
  if(!arr.includes(key))arr.push(key);
  renderChips();markDirty();toast('Added to '+type);
}
function removeConn(type,key){
  editing.guildOverrides[type]=editing.guildOverrides[type].filter(k=>k!==key);
  renderChips();markDirty();
}

/* ===== Persist ===== */
function collect(){
  editing.source=document.getElementById('f_source').value;
  editing.note=document.getElementById('f_note').value;
  const sp=document.getElementById('f_spacing').value;
  const sd=document.getElementById('f_soilDepth').value;
  if(sp)editing.spacingOverride=Number(sp);else delete editing.spacingOverride;
  if(sd)editing.soilDepthOverride=Number(sd);else delete editing.soilDepthOverride;
  const caut=document.getElementById('f_caution').value;
  if(caut){editing.flags=editing.flags||{};editing.flags.caution=caut;}
  // drop empties
  if(!editing.expertTips.length)delete editing.expertTips;
  if(!editing.expertVarieties.length)delete editing.expertVarieties;
  if(!editing.principles.length)delete editing.principles;
  if(!editing.guildOverrides.companions.length)delete editing.guildOverrides.companions;
  if(!editing.guildOverrides.antagonists.length)delete editing.guildOverrides.antagonists;
  if(!Object.keys(editing.guildOverrides).length)delete editing.guildOverrides;
  if(!editing.source)delete editing.source;
  if(!editing.note)delete editing.note;
  // if empty overall, drop the species
  if(Object.keys(editing).length===0){delete overlay[currentKey];}
  else{overlay[currentKey]=editing;}
}
function markDirty(){collect();renderList(document.getElementById('spSearch').value);}
function saveLocal(){
  collect();
  try{localStorage.setItem('soilpepper.expertOverlay',JSON.stringify(overlay));toast('💾 Draft saved on this device');}
  catch(e){toast('Could not save (private mode)');}
}
function exportJSON(){
  collect();
  const out={version:1,expert:document.getElementById('f_source').value||'expert',layers:[],species:overlay};
  const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='expert-overlay.json';
  a.click();
  toast('⬇ Overlay exported — send it back to SOILPEPPER');
}
function newLayer(){
  if(confirm('Start a fresh overlay? Unsaved edits are lost.')){overlay={};currentKey=null;
    document.getElementById('editorHead').style.display='none';
    document.getElementById('editorBody').style.display='none';
    document.getElementById('editorEmpty').style.display='block';
    renderList('');}
}
/* ===== Toast ===== */
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2200);}

/* ===== Load saved draft if present ===== */
(function(){
  try{const saved=localStorage.getItem('soilpepper.expertOverlay');if(saved){overlay=JSON.parse(saved);}}
  catch(e){}
  renderList('');
})();
</script>
</body>
</html>
