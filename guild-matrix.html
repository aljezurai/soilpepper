<style id="mobile-sys">/* ══════════════════════════════════════════════════════════════
   SOILPEPPER SHARED MOBILE DESIGN SYSTEM (2026-08-08)
   Injected into all field tools + landing. Systemic mobile fixes:
   touch targets ≥44px · tap feedback · no tap-highlight flash ·
   safe areas · text-size stability · scroll snappiness.
   Marker: MOBILE-SYS-v1
   ══════════════════════════════════════════════════════════════ */
/* ── Base mobile hygiene ───────────────────────────────────── */
* {
  -webkit-tap-highlight-color: transparent;
}
html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
body {
  overscroll-behavior-y: none;
}

/* ── Tap feedback: every tappable gets a visible press state ── */
button, a, [onclick], [role="button"], .toggle, .chip, .btn,
.tool-card, .plant-item, .species-item, .filter-btn, .legend-item,
[class*="btn"], [class*="chip"], [class*="toggle"] {
  touch-action: manipulation;            /* kill 300ms delay + double-tap zoom */
  cursor: pointer;
  -webkit-user-select: none;
  user-select: none;
  transition: transform 0.08s ease, opacity 0.08s ease, background-color 0.12s ease;
}
button:active, [onclick]:active, a:active, .toggle:active, .chip:active,
.btn:active, .tool-card:active, .plant-item:active, .species-item:active,
.filter-btn:active, [class*="btn"]:active, [class*="chip"]:active,
[class*="toggle"]:active, .legend-item:active {
  transform: scale(0.96);
  opacity: 0.82;
}

/* ── Safe areas (iPhone notch / home indicator) ─────────────── */
@supports (padding: env(safe-area-inset-bottom)) {
  body {
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
  }
  .sticky-bottom, [class*="sticky"], .bottom-bar, [class*="action-bar"],
  .fab, [class*="fab"] {
    padding-bottom: max(env(safe-area-inset-bottom), 8px);
  }
}

/* ── MOBILE: 768px and below ────────────────────────────────── */
@media (max-width: 768px) {
  /* All buttons/links/tappables reach the 44px touch minimum */
  button, .btn, [class*="btn"], .toggle, .chip, [class*="chip"],
  .filter-btn, a.tool-card-link, .tool-card-link, .plant-item,
  .species-item, .sector-btn, .legend-item {
    min-height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  /* split/small utility buttons get full touch height but stay compact */
  button {
    padding-top: 10px;
    padding-bottom: 10px;
  }
  /* Table cells become roomier; prevent tiny text */
  table { font-size: 14px; }
  td, th { padding: 8px 6px; }
  /* Inputs/selects reach touch minimum */
  input, select, textarea {
    min-height: 44px;
    font-size: 16px !important;   /* prevents iOS auto-zoom on focus */
  }
  /* Headings scale sanely */
  h1 { font-size: 1.35rem; }
  h2 { font-size: 1.15rem; }
  h3 { font-size: 1.02rem; }
  /* Prevent horizontal scroll from stray fixed widths */
  img, svg, canvas, table, pre, code { max-width: 100%; }
  .sector-plot, [class*="plot"], [class*="diagram"], [class*="canvas"] {
    max-width: 100%;
  }
}

/* ── MOBILE: 480px and below (phones) ───────────────────────── */
@media (max-width: 480px) {
  /* Compact card padding on phones */
  .tool-card, [class*="card"] {
    padding: 12px;
  }
  /* Utility rows wrap instead of overflow */
  .btn-row, [class*="btn-row"], .button-row, [class*="actions"] {
    flex-wrap: wrap;
    gap: 8px;
  }
  .btn-row button, [class*="btn-row"] button, [class*="actions"] button {
    flex: 1 1 auto;
    min-width: 0;
  }
  /* Prevent accidental double-tap zoom on rapid taps */
  button, a, [onclick] { touch-action: manipulation; }
}

/* ── MOBILE: sticky bottom action bar helper ────────────────── */
.sticky-bottom {
  position: sticky;
  bottom: 0;
  z-index: 40;
  background: inherit;
  backdrop-filter: blur(8px);
}
</style>

<style>
:root {
  --bg: #0a1a0a;
  --panel: #0e220e;
  --card: #143014;
  --border: #33691e;
  --accent: #81c784;
  --gold: #c4a040;
  --text: #e8dcc0;
  --text2: #b0c8a8;
  --danger: #c0392b;
  --warn: #e67e22;
  --good: #27ae60;
  --good2: #2d7a46;
  --gray: #2a2a2a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
}
header {
  background: linear-gradient(135deg, #0e220e 0%, #143014 100%);

}
h1 { font-size: 1.6em; color: var(--gold); }
h1 .sub { color: var(--text2); font-size: 0.6em; margin-left: 12px; font-style: italic; }

.app { display: flex; gap: 0; min-height: calc(100vh - 80px); }

/* Sidebar — species selector */
.sidebar {
  width: 280px; min-width: 280px; border-right: 1px solid var(--border);
  overflow-y: auto; max-height: calc(100vh - 80px); position: sticky; top: 80px;
  background: var(--panel);
}
.sidebar h2 { padding: 16px 20px 8px; font-size: 1.1em; color: var(--gold); }
.sidebar .search { padding: 0 20px 12px; }
.sidebar input {
  width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px;
  background: rgba(0,0,0,0.3); color: var(--text);
  font-family: inherit; font-size: 0.9em; outline: none;
}
.sidebar input:focus { border-color: var(--accent); }
.species-list { padding: 0 14px 20px; }
.species-item {
  display: flex; align-items: center; gap: 8px; padding: 8px 10px; cursor: pointer;
  border-radius: 6px; transition: background 0.15s; font-size: 0.88em; color: var(--text2);
}
.species-item:hover { background: rgba(0,0,0,0.3); }
.species-item.active { background: rgba(76,175,80,0.15); color: var(--accent); }
.species-item .icon { font-size: 1.2em; flex-shrink: 0; }
.species-item .cat {
  margin-left: auto; font-size: 0.7em; text-transform: uppercase; letter-spacing: 0.5px;
  color: rgba(255,255,255,0.25); padding: 2px 6px; border-radius: 4px; background: rgba(0,0,0,0.2);
}

/* Main content */
.main { flex: 1; padding: 30px; max-height: calc(100vh - 80px); overflow-y: auto; }

/* Species profile card */
.profile {
  background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  padding: 24px; margin-bottom: 24px;
}
.profile h2 { font-size: 1.4em; color: var(--gold); margin-bottom: 4px; }
.profile .sub { font-size: 0.85em; color: var(--text2); margin-bottom: 16px; font-style: italic; }

.tag-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.tag-row .label { font-size: 0.78em; text-transform: uppercase; letter-spacing: 0.5px; color: rgba(255,255,255,0.3); width: 100%; margin-top: 6px; }
.gives-tags .tag, .needs-tags .tag, .mineral-tags .tag {
  display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 6px;
  font-size: 0.8em; cursor: default;
}
.gives-tags .tag { background: rgba(39,174,96,0.2); color: var(--good); border: 1px solid rgba(39,174,96,0.3); }
.needs-tags .tag { background: rgba(230,126,34,0.2); color: var(--warn); border: 1px solid rgba(230,126,34,0.3); }
.mineral-tags .tag { background: rgba(196,160,64,0.15); color: var(--gold); border: 1px solid rgba(196,160,64,0.25); }
.root-tag {
  display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 6px;
  font-size: 0.8em; background: rgba(0,0,0,0.2); color: var(--text2); border: 1px solid rgba(255,255,255,0.1);
}

/* Unmet needs alert */
.unmet-box {
  margin-top: 12px; padding: 12px 16px; border-radius: 8px;
  background: rgba(230,126,34,0.08); border: 1px solid rgba(230,126,34,0.2);
}
.unmet-box .title { font-size: 0.82em; color: var(--warn); font-weight: bold; margin-bottom: 6px; }
.unmet-box .desc { font-size: 0.85em; color: var(--text2); line-height: 1.5; }

/* Companion table */
.companion-table {
  width: 100%; border-collapse: collapse; font-size: 0.88em;
}
.companion-table th {
  text-align: left; padding: 10px 14px; border-bottom: 2px solid var(--border);
  color: var(--gold); font-size: 0.85em; text-transform: uppercase; letter-spacing: 0.5px;
}
.companion-table td {
  padding: 10px 14px; border-bottom: 1px solid rgba(255,255,255,0.05); color: var(--text2);
}
.companion-table tr:hover td { background: rgba(0,0,0,0.2); }
.score-cell { font-weight: bold; font-size: 1.1em; }
.score-cell.high { color: #2ecc71; }
.score-cell.med { color: var(--gold); }
.score-cell.low { color: rgba(255,255,255,0.3); }
.score-cell.antagonist { color: var(--danger); }

.reason-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.reason-tags .rt {
  font-size: 0.7em; padding: 2px 6px; border-radius: 4px;
}
.reason-tags .rt.gives { background: rgba(39,174,96,0.15); color: rgba(39,174,96,0.8); }
.reason-tags .rt.needs { background: rgba(230,126,34,0.15); color: rgba(230,126,34,0.8); }
.reason-tags .rt.companion { background: rgba(196,160,64,0.15); color: var(--gold); }
.reason-tags .rt.antagonist { background: rgba(192,57,43,0.15); color: var(--danger); }

/* Filter tabs */
.tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
.tab {
  padding: 6px 16px; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;
  background: rgba(0,0,0,0.2); color: var(--text2); cursor: pointer; font-size: 0.85em; font-family: inherit;
  transition: all 0.15s;
}
.tab:hover { border-color: var(--border); }
.tab.active { background: rgba(76,175,80,0.15); border-color: var(--border); color: var(--accent); }

.empty-state { text-align: center; padding: 60px 20px; color: var(--text2); }
.empty-state .big { font-size: 3em; margin-bottom: 12px; }
.empty-state .msg { font-size: 1.1em; }

.legend { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
.legend .item { display: flex; align-items: center; gap: 6px; font-size: 0.8em; color: var(--text2); }
.legend .swatch { width: 16px; height: 16px; border-radius: 4px; }

/* Mobile — hidden by default */
.mobile-species-btn { display: none; }
.mobile-sidebar-backdrop { display: none; }

/* Mobile responsive */
@media (max-width: 768px) {
  header { padding: 14px 16px; }
  h1 { font-size: 1.2em; }
  h1 .sub { display: none; }

  /* Sidebar becomes slide-out drawer */
  .sidebar {
    position: fixed; top: 0; left: 0; width: 85%; max-width: 320px;
    height: 100vh; z-index: 200; transform: translateX(-100%);
    transition: transform 0.25s ease; max-height: 100vh; top: 0;
    box-shadow: 4px 0 20px rgba(0,0,0,0.5);
  }
  .sidebar.open { transform: translateX(0); }
  .sidebar input { padding: 12px 14px; font-size: 1em; }

  /* Backdrop */
  .mobile-sidebar-backdrop {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.5); z-index: 199;
  }
  .mobile-sidebar-backdrop.open { display: block; }

  /* Floating species button */
  .mobile-species-btn {
    display: flex; align-items: center; gap: 6px;
    position: fixed; bottom: 16px; right: 16px; z-index: 100;
    padding: 14px 20px; border-radius: 28px; border: 1px solid var(--border);
    background: var(--card); color: var(--accent); font-size: 0.95em; cursor: pointer;
    font-family: inherit; box-shadow: 0 4px 16px rgba(0,0,0,0.4);
  }

  /* Main content full width */
  .main { flex: 1; padding: 16px; max-height: none; overflow-y: visible; }
  .app { flex-direction: column; min-height: auto; }

  /* Profile card */
  .profile { padding: 16px; }
  .profile h2 { font-size: 1.2em; }

  /* Tags — bigger tap targets */
  .gives-tags .tag, .needs-tags .tag, .mineral-tags .tag {
    padding: 6px 12px; font-size: 0.85em;
  }

  /* Tabs — bigger, scrollable */
  .tabs { gap: 6px; overflow-x: auto; flex-wrap: nowrap; padding-bottom: 4px; }
  .tab { padding: 10px 16px; font-size: 0.9em; min-height: 44px; white-space: nowrap; }

  /* Companion table — horizontal scroll on small screens */
  .companion-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .companion-table { min-width: 480px; }
  .companion-table th { padding: 12px 10px; font-size: 0.8em; }
  .companion-table td { padding: 12px 10px; }

  /* Reason tags — bigger */
  .reason-tags .rt { padding: 4px 8px; font-size: 0.78em; }

  /* Unmet box */
  .unmet-box { padding: 10px 14px; }
  .unmet-box .title { font-size: 0.85em; }
  .unmet-box .desc { font-size: 0.82em; }

  /* Legend */
  .legend { gap: 10px; }
  .legend .item { font-size: 0.75em; }

  /* Species items — bigger tap targets */
  .species-item { padding: 12px 10px; font-size: 0.95em; min-height: 48px; }
  .species-item .cat { font-size: 0.65em; }
}
</style>

<style id="sage-forte">/* ══════════════════════════════════════════════════════════════
   SOILPEPPER SOFT SAGE + TOSCANE GOLD DESIGN SYSTEM (2026-08-09)
   Approved variant 8: soft-sage cards, deeper sage bg, gold buttons.
   Marker: SAGE-FORTE-v1
   Headings: Fraunces → Georgia serif fallback (offline-safe)
   Body: Nunito → system-ui fallback (offline-safe)
   ══════════════════════════════════════════════════════════════ */

/* ── Tokens ─────────────────────────────────────────────── */
:root {
  --sf-bg:        #cdd8c8;   /* deeper sage page background */
  --sf-bg-deep:   #bcc9b4;   /* deepest sage (panels) */
  --sf-header:    #2c4a32;   /* deep forest green */
  --sf-header-2:  #3e6a46;   /* slightly lighter green */
  --sf-card:      #edf2e6;   /* soft sage cards (was #fff) */
  --sf-card-alt:  #eef4ec;   /* subtle alt card */
  --sf-card-bright:#ffffff;  /* bright accents: brief strip, sow chips */
  --sf-border:    #a8c0a8;   /* card borders */
  --sf-border-strong: #8aa88c; /* buttons/beds */
  --sf-ink:       #1e2c22;   /* near-black green text */
  --sf-ink-soft:  #3a4a3e;   /* secondary text */
  --sf-muted:     #4a5c4e;   /* tertiary text */
  --sf-accent:    #c8492e;   /* pepper red */
  --sf-accent-dark:#a8381e;
  --sf-green:     #2e7a3a;   /* action green */
  --sf-sage-soft: #dcead8;   /* sow-month / tags */
  --sf-gold:      #f5ead6;   /* Toscane gold button bg */
  --sf-gold-ink:  #8a6420;   /* Toscane gold button text */
  --sf-gold-border:#e0d0a8;  /* Toscane gold button border */
  --sf-gold-border-soft:#d8c898;
  --sf-radius:    16px;
  --sf-radius-lg: 18px;
  --sf-shadow:    0 2px 8px rgba(20,50,24,.14);
  --sf-shadow-lg: 0 3px 10px rgba(20,50,24,.28);
  --sf-font-head: 'Fraunces', Georgia, 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
  --sf-font-body: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
}

/* ── Base ───────────────────────────────────────────────── */
html { scrollbar-color: #8aa88c #dde6da; }
body {
  background: var(--sf-bg) !important;
  color: var(--sf-ink) !important;
  font-family: var(--sf-font-body) !important;
}
h1, h2, h3, h4, h5, .title, [class*="title"] {
  font-family: var(--sf-font-head) !important;
  color: var(--sf-header) !important;
}
a { color: var(--sf-green) !important; }
input, select, textarea, button { font-family: var(--sf-font-body) !important; }

/* ── Headers / top bars ─────────────────────────────────── */
header, .topbar, [class*="header"], [class*="top-bar"], [class*="banner"], .masthead {
  background: var(--sf-header) !important;
  color: #ffffff !important;
  border-color: #1e3624 !important;
}
header h1, .topbar h1, [class*="header"] h1, [class*="banner"] h1, .masthead h1,
header h2, .topbar h2, [class*="header"] h2, [class*="banner"] h2,
header a, [class*="header"] a, .topbar a {
  color: #ffffff !important;
}
header a:hover, [class*="header"] a:hover { color: #cfe4d4 !important; }

/* ── Cards & panels ─────────────────────────────────────── */
.card, [class*="card"], .panel, [class*="panel"], .modal, [class*="popup"],
.info-panel, .spec, .spec-card, .palette, .sidebar {
  background: var(--sf-card) !important;
  border-color: var(--sf-border) !important;
  border-radius: var(--sf-radius) !important;
  box-shadow: var(--sf-shadow) !important;
  color: var(--sf-ink) !important;
}
/* modal specifically: white on white must stay readable */
.modal, [class*="popup"], .info-panel {
  background: var(--sf-card) !important;
  box-shadow: var(--sf-shadow-lg) !important;
}

/* ── Buttons — Toscane gold pills (mockup-exact) ────────── */
button, .btn, [class*="btn"], [class*="toggle"], [class*="chip"], [class*="filter-btn"] {
  background: var(--sf-gold) !important;
  color: var(--sf-gold-ink) !important;
  border: 2px solid var(--sf-gold-border) !important;
  border-radius: 999px !important;
  font-weight: 800 !important;
  box-shadow: 0 2px 4px rgba(90,70,30,.15) !important;
}
button:hover, .btn:hover, [class*="btn"]:hover {
  box-shadow: 0 4px 12px rgba(90,70,30,.22) !important;
}
button.active, .btn.active, [class*="btn"].active, [class*="toggle"].active, .active-toggle {
  background: var(--sf-header-2) !important;
  color: #ffffff !important;
  border-color: var(--sf-header) !important;
}
/* primary = pepper red */
.btn-primary, button.primary, [class*="btn-primary"], .primary-action {
  background: var(--sf-accent) !important;
  border-color: var(--sf-accent-dark) !important;
  color: #ffffff !important;
}
/* danger */
.btn-danger, button.danger, [class*="btn-danger"] {
  background: #fdf2ee !important;
  border-color: #d8a090 !important;
  color: #8a3a2a !important;
}
/* ghost */
.btn-ghost, button.ghost, [class*="btn-ghost"] {
  background: transparent !important;
  border-color: var(--sf-gold-border-soft) !important;
  color: var(--sf-gold-ink) !important;
}

/* ── Inputs ─────────────────────────────────────────────── */
input, select, textarea {
  background: var(--sf-card) !important;
  color: var(--sf-ink) !important;
  border: 1.5px solid var(--sf-border-strong) !important;
  border-radius: 8px !important;
}
label, [class*="label"], th { color: var(--sf-header) !important; }

/* ── Beds / garden area ─────────────────────────────────── */
.bed, .bed-slot, .bed-joined, [class*="bed"] {
  background: #f2f6ec !important;
  border: 2px solid var(--sf-border-strong) !important;
  border-radius: 14px !important;
  box-shadow: var(--sf-shadow) !important;
}
.plant-in-bed, .plant-item, [class*="plant"] {
  background: #e8f0e6 !important;
  border: 1.5px solid #6a9068 !important;
  border-radius: 10px !important;
  color: var(--sf-ink) !important;
  font-weight: 700 !important;
}
.days-badge, [class*="badge"] { color: var(--sf-ink) !important; }
/* join/split toggles inside beds — Toscane gold */
.bed .join button, [class*="join"] button, [class*="split"] button {
  background: var(--sf-gold) !important;
  border: 1.5px solid var(--sf-gold-border-soft) !important;
  color: var(--sf-gold-ink) !important;
  border-radius: 8px !important;
  font-weight: 800 !important;
}

/* ── Tables / grids ─────────────────────────────────────── */
table, .grid, [class*="grid"] {
  background: var(--sf-card) !important;
  color: var(--sf-ink) !important;
}
td, th, [class*="cell"] {
  color: var(--sf-ink) !important;
  border-color: var(--sf-border) !important;
}
tr, .row, [class*="row"] { color: var(--sf-ink) !important; }

/* ── Muted / secondary text ─────────────────────────────── */
[class*="hint"], [class*="note"], .subtitle, [class*="subtitle"], [class*="muted"],
[class*="meta"], [class*="footer"], [class*="stat"], [class*="crumb"] {
  color: var(--sf-muted) !important;
}

/* ── Sow-month / info highlights ────────────────────────── */
.sow-month, [class*="sow-month"], [class*="sow-harvest"] {
  background: var(--sf-sage-soft) !important;
  border-color: #9cbc98 !important;
  color: var(--sf-ink) !important;
}
.sow-harvest-bar, .sh-seg, [class*="sh-"] {
  border-color: #9cbc98 !important;
}

/* ── Module labels ──────────────────────────────────────── */
[class*="module-label"], [class*="module"] {
  background: var(--sf-header) !important;
  color: #ffffff !important;
  border-radius: 10px !important;
}

/* ── Brief strip (injected) — bright white per mockup ───── */
div[style*="142114"], div[style*="20, 33, 20"], div[style*="20,33,20"] {
  background: var(--sf-card-bright) !important;
  border-color: var(--sf-border) !important;
  color: var(--sf-ink-soft) !important;
}

<!-- DESIGN BRIEF STRIP (shared reader — injected by design-brief system) -->
<script>
(function () {
  // Shared design brief from Master Plan (tuscan-brief-v1). Static tools only
  // READ it — they never write. Falls back to region-appropriate defaults:
  // Tuscan defaults for tuscany, Dutch defaults for netherlands (2026-08-07).
  var KEY = 'tuscan-brief-v1';

  // Region from URL first (tools pass ?region=), else the stored brief, else tuscany
  var urlRegion = null;
  try {
    var q = new URLSearchParams(window.location.search);
    urlRegion = q.get('region');
  } catch (e) {}
  var storedRegion = null;
  try {
    var raw0 = localStorage.getItem(KEY);
    if (raw0) storedRegion = (JSON.parse(raw0) || {}).region;
  } catch (e) {}
  var region = (urlRegion === 'netherlands' || urlRegion === 'tuscany') ? urlRegion : (storedRegion === 'netherlands' ? 'netherlands' : 'tuscany');
  var NL = region === 'netherlands';

  var DEF = NL ? {
    region: 'netherlands', title: 'Mijn perceel',
    plotW: 80, plotH: 60, cellSize: 10,
    defaultSoil: 'sandy', altitude: 12, climateZone: '7b-8a',
    aspect: 'West (270°)', slope: '~2% flauw'
  } : {
    region: 'tuscany', title: 'Tuscan hillside',
    plotW: 100, plotH: 100, cellSize: 10,
    defaultSoil: 'silty', altitude: 300, climateZone: '8b-9a',
    aspect: 'South (180°)', slope: '~10% moderate'
  };
  var b = DEF;
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) { var p = JSON.parse(raw); for (var k in DEF) if (p[k] !== undefined) b[k] = p[k]; }
  } catch (e) {}
  // The stored brief's own region wins if it exists (one source of truth)
  if (storedRegion === 'netherlands' || storedRegion === 'tuscany') region = storedRegion;
  NL = region === 'netherlands';

  var soilLbl = { sandy: 'Sandy', silty: 'Silty', loam: 'Loam', clay: 'Clay', chalky: 'Chalky', peaty: 'Peaty' }[b.defaultSoil] || b.defaultSoil;
  var soilLblNL = { sandy: 'Zandgrond', silty: 'Silt', loam: 'Leem', clay: 'Klei', chalky: 'Kalkrijk', peaty: 'Veen' }[b.defaultSoil] || b.defaultSoil;
  var regionLbl = NL ? 'Nederland' : 'Tuscany';
  var soilTxt = NL ? soilLblNL : (soilLbl + ' soil');
  var cellsTxt = NL ? 'cellen' : 'cells';
  var editTxt = NL ? 'Bewerken in Master Plan' : 'Edit in Master Plan';

  // Build the strip — collapsible on mobile (compact line + tap to expand),
  // full details on desktop. 2026-08-08.
  var strip = document.createElement('div');
  strip.style.cssText = 'background:#142114;border:1px solid #1a301a;border-radius:6px;padding:0;margin:0 auto 12px;' +
    'max-width:900px;font-size:0.72rem;color:#a8b8a0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;';
  var titleTxt = '<span style="color:#c4a040;font-weight:600">' + (b.title || 'Design') + '</span>';
  var regionTxt = '<span>' + regionLbl + '</span>';
  var editHtml = '<a href="master-plan.html?region=' + region + '" style="color:#5a8a4a;text-decoration:none;font-weight:600">⚙️ ' + editTxt + '</a>';
  var detailParts = [
    '<span>' + b.plotW + '×' + b.plotH + 'm · ' + b.cellSize + 'm ' + cellsTxt + '</span>',
    '<span>' + soilTxt + '</span>',
    '<span>~' + b.altitude + 'm</span>',
    '<span>Zone ' + b.climateZone + '</span>',
    '<span>' + b.aspect + '</span>',
    '<span>' + b.slope + '</span>'
  ];
  // Mobile compact line:  title · region · toggle-btn (right)
  var compact = document.createElement('div');
  compact.style.cssText = 'display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 12px;cursor:pointer;';
  var editWrap = document.createElement('span');
  editWrap.innerHTML = editHtml;
  compact.innerHTML = '<span style="display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;">' + titleTxt +
    '<span style="opacity:0.4">·</span>' + regionTxt + '</span>';
  compact.appendChild(editWrap);
  compact.addEventListener('click', function (ev) {
    if (ev.target && ev.target.closest && ev.target.closest('a')) return; // don't toggle when tapping the edit link
    var open = strip.getAttribute('data-open') !== '1';
    strip.setAttribute('data-open', open ? '1' : '0');
    details.style.display = open ? 'flex' : 'none';
    toggleBtn.textContent = open ? '▴' : '▾';
  });
  var toggleBtn = document.createElement('span');
  toggleBtn.style.cssText = 'font-size:0.8rem;color:#5a8a4a;padding:2px 6px;';
  toggleBtn.textContent = '▾';
  compact.insertBefore(toggleBtn, editWrap);
  // Details row (hidden on mobile, always visible on desktop via media query)
  var details = document.createElement('div');
  details.style.cssText = 'display:none;flex-wrap:wrap;gap:4px 14px;justify-content:center;align-items:center;' +
    'padding:4px 12px 8px;border-top:1px solid #1a301a;font-size:0.72rem;color:#a8b8a0;';
  details.innerHTML = detailParts.join('<span style="opacity:0.4">·</span>');
  strip.appendChild(compact);
  strip.appendChild(details);
  // Desktop: show details, hide toggle. Mobile: compact + toggle (default closed).
  // Small injected style block scoped to the strip (no conflicts with tool CSS).
  var styleEl = document.createElement('style');
  styleEl.textContent =
    '@media (min-width:769px){ .bstrip-details{display:flex !important;} .bstrip-toggle{display:none !important;} }';
  compact.className = 'bstrip-compact';
  toggleBtn.className = 'bstrip-toggle';
  details.className = 'bstrip-details';
  strip.appendChild(styleEl);
  var body = document.body;
  body.insertBefore(strip, body.firstChild);

  // Sector Analysis: prefill params from the brief once the page is ready
  // (one-way: brief is the source of truth; user can still override locally)
  function prefillSectorParams() {
    // Aspect: match degrees (e.g. "South (180°)" → 180) to the select options
    var aspEl = document.getElementById('aspect');
    if (aspEl && b.aspect) {
      var mDeg = String(b.aspect).match(/(\d+)/);
      var deg = mDeg ? parseInt(mDeg[1], 10) : NaN;
      if (!isNaN(deg)) {
        for (var i = 0; i < aspEl.options.length; i++) {
          if (parseInt(aspEl.options[i].value, 10) === deg) { aspEl.value = aspEl.options[i].value; break; }
        }
      }
    }
    // Altitude: brief value → number input
    var altEl = document.getElementById('altitude');
    if (altEl && b.altitude) {
      altEl.value = b.altitude;
      if (typeof updateSectors === 'function') updateSectors();
    }
    // Slope: match brief slope % to the select options
    var slEl = document.getElementById('slope');
    if (slEl && b.slope) {
      var mSl = String(b.slope).match(/(\d+)/);
      var sl = mSl ? parseInt(mSl[1], 10) : NaN;
      if (!isNaN(sl)) {
        for (var i = 0; i < slEl.options.length; i++) {
          if (parseInt(slEl.options[i].value, 10) === sl) { slEl.value = slEl.options[i].value; break; }
        }
      }
    }
    // Live "Modular Parameters" reference table (if present)
    var pAsp = document.getElementById('param-aspect');
    if (pAsp && b.aspect) pAsp.textContent = b.aspect;
    var pAlt = document.getElementById('param-altitude');
    if (pAlt && b.altitude) pAlt.textContent = b.altitude + 'm';
    var pSl = document.getElementById('param-slope');
    if (pSl && b.slope) {
      var mP = String(b.slope).match(/(\d+)/);
      pSl.textContent = (mP ? mP[1] : b.slope) + '%';
    }
    // Live summary sentence + sun stats (if present)
    var facing = function (deg) {
      var d = parseInt(deg, 10);
      if (d >= 315 || d < 45) return NL ? 'op het noorden' : 'north-facing';
      if (d >= 45 && d < 135) return NL ? 'op het oosten' : 'east-facing';
      if (d >= 135 && d < 225) return NL ? 'op het zuiden' : 'south-facing';
      return NL ? 'op het westen' : 'west-facing';
    };
    var sumAlt = document.getElementById('sum-altitude');
    if (sumAlt && b.altitude) sumAlt.textContent = '~' + b.altitude + 'm';
    var sumReg = document.getElementById('sum-region');
    if (sumReg) sumReg.textContent = NL ? 'Nederland' : 'Tuscany';
    var sumAsp = document.getElementById('sum-aspect');
    if (sumAsp && b.aspect) {
      var dA = String(b.aspect).match(/(\d+)/);
      if (dA) sumAsp.textContent = facing(dA[1]);
    }
    var latEl2 = document.getElementById('lat');
    var latVal = latEl2 ? (parseFloat(latEl2.value) || (NL ? 52 : 43)) : (NL ? 52 : 43);
    var stLat = document.getElementById('st-lat');
    if (stLat) stLat.textContent = Math.round(latVal) + '°N';
    var stSum = document.getElementById('st-summer');
    if (stSum) stSum.textContent = Math.round((90 - latVal + 23.44) * 10) / 10 + '°';
    var stWin = document.getElementById('st-winter');
    if (stWin) stWin.textContent = Math.round((90 - latVal - 23.44) * 10) / 10 + '°';
    var stAsp = document.getElementById('st-aspect');
    if (stAsp && b.aspect) {
      var dA2 = String(b.aspect).match(/(\d+)/);
      if (dA2) stAsp.textContent = facing(dA2[1]);
    }
    // Water Management: plot size + altitude in subtitle (if present)
    var wmPlot = document.getElementById('wm-plot');
    if (wmPlot && b.plotW && b.plotH) {
      var ha = (b.plotW * b.plotH) / 10000;
      wmPlot.textContent = (ha >= 1 ? (Math.round(ha * 10) / 10) + ' ha' : Math.round(b.plotW * b.plotH) + ' m²');
    }
    var wmAlt = document.getElementById('wm-alt');
    if (wmAlt && b.altitude) wmAlt.textContent = '~' + b.altitude + 'm ' + (NL ? 'hoogte' : 'altitude');
    // Design Proposal: Site Overview body from the brief (if present)
    var dpAlt = document.getElementById('dp-alt');
    if (dpAlt && b.altitude) dpAlt.textContent = b.altitude;
    var dpZone = document.getElementById('dp-zone');
    if (dpZone && b.climateZone) dpZone.textContent = b.climateZone;
    var dpArea = document.getElementById('dp-area');
    if (dpArea && b.plotW && b.plotH) {
      var dpHa = (b.plotW * b.plotH) / 10000;
      dpArea.textContent = (dpHa >= 1 ? dpHa + ' hectares' : Math.round(b.plotW * b.plotH) + ' m²') + ' (' + b.plotW + '×' + b.plotH + 'm)';
    }
    var dpRain = document.getElementById('dp-rain');
    var waterForRain = null;
    try { waterForRain = JSON.parse(localStorage.getItem('tuscan-water-v1') || 'null'); } catch (e) {}
    if (dpRain && waterForRain && waterForRain.rainfall) dpRain.textContent = waterForRain.rainfall;
    // Summary cards: site area + swales
    var cardArea = document.getElementById('card-area');
    if (cardArea && b.plotW && b.plotH) {
      var cHa = (b.plotW * b.plotH) / 10000;
      cardArea.textContent = (cHa >= 1 ? cHa + ' ha' : Math.round(b.plotW * b.plotH) + ' m²');
    }
    var cardSwales = document.getElementById('card-swales');
    if (cardSwales && waterForRain && waterForRain.swales) cardSwales.textContent = waterForRain.swales;
    // Subtitle (top of page): area, altitude, zone, location
    var subArea = document.getElementById('sub-area');
    if (subArea && b.plotW && b.plotH) {
      var sHa = (b.plotW * b.plotH) / 10000;
      subArea.textContent = NL ? (sHa >= 1 ? sHa + 'ha Terrein' : Math.round(b.plotW * b.plotH) + 'm² Terrein') : (sHa >= 1 ? sHa + 'ha Hillside' : Math.round(b.plotW * b.plotH) + 'm² Site');
    }
    var subAlt = document.getElementById('sub-alt');
    if (subAlt && b.altitude) subAlt.textContent = b.altitude;
    var subZone = document.getElementById('sub-zone');
    if (subZone && b.climateZone) subZone.textContent = b.climateZone;
    var subLoc = document.getElementById('sub-loc');
    if (subLoc) subLoc.textContent = NL ? 'Nederland' : 'Tuscany, Italy';
    if (typeof updateSectors === 'function') updateSectors();
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', prefillSectorParams);
  } else {
    prefillSectorParams();
  }
})();
</script>

// ============ SCORING LOGIC ============
function computeScore(keyA, keyB) {
  const a = SPECIES[keyA], b = SPECIES[keyB];
  if (!a.guild || !b.guild) return { score: 0, reasons: [], isAntagonist: false, isCompanion: false };

  let score = 0;
  let reasons = [];
  let isAntagonist = false;
  let isCompanion = false;

  // Check companion match
  if (a.guild.companions && a.guild.companions.includes(keyB)) {
    score += 5; isCompanion = true;
    reasons.push({ type: 'companion', text: tt('companionReason') });
  }
  // Check antagonist match
  if (a.guild.antagonists && a.guild.antagonists.includes(keyB)) {
    score -= 10; isAntagonist = true;
    reasons.push({ type: 'antagonist', text: tt('antagonistReason') });
  }

  // B gives to A — A's needs met by B's gives
  if (a.guild.needs && b.guild.gives) {
    for (const need of a.guild.needs) {
      const matchingGives = NEEDS_TO_GIVES[need] || [];
      for (const gives of matchingGives) {
        if (b.guild.gives.includes(gives)) {
          score += 2;
          reasons.push({ type: 'needs', text: ` ${spName(b)} ${tt('givesArrow')} ${glbl(gives)} → ${spName(a)} ${tt('needsArrow')} ${nlbl(need)}` });
        }
      }
      // Mineral-specific match
      if (need === 'potassium' && b.guild.accumulates && b.guild.accumulates.includes('potassium')) {
        score += 1;
        reasons.push({ type: 'needs', text: ` ${spName(b)} ${tt('accumulatesReason')} K → ${spName(a)} ${tt('needsArrow')} ${nlbl('potassium')}` });
      }
      if (need === 'nitrogen' && b.guild.accumulates && b.guild.accumulates.includes('nitrogen')) {
        score += 1;
        reasons.push({ type: 'needs', text: ` ${spName(b)} ${tt('accumulatesReason')} N → ${spName(a)} ${tt('needsArrow')} ${nlbl('nitrogen')}` });
      }
    }
  }

  // A gives to B — A's gives meet B's needs (mutual benefit)
  if (a.guild.gives && b.guild.needs) {
    for (const need of b.guild.needs) {
      const matchingGives = NEEDS_TO_GIVES[need] || [];
      for (const gives of matchingGives) {
        if (a.guild.gives.includes(gives)) {
          score += 2;
          reasons.push({ type: 'gives', text: ` ${spName(a)} ${tt('givesArrow')} ${glbl(gives)} → ${spName(b)} ${tt('needsArrow')} ${nlbl(need)}` });
        }
      }
    }
  }

  // Root zone compatibility — different root zones = good stacking
  if (a.guild.rootZone && b.guild.rootZone && a.guild.rootZone !== b.guild.rootZone) {
    score += 1;
    reasons.push({ type: 'gives', text: tt('rootComplement') + ` (${a.guild.rootZone} vs ${b.guild.rootZone})` });
  }

  return {
    score: Math.max(score, isAntagonist ? score : 0),
    reasons,
    isAntagonist,
    isCompanion
  };
}

// ============ RENDERING ============
let selectedKey = null;
let filterMode = 'all'; // all | trees | shrubs | vegetables | herbs

function renderSidebar() {
  const list = document.getElementById('species-list');
  const search = document.getElementById('search-input').value.toLowerCase();
  list.innerHTML = '';

  const entries = Object.entries(SPECIES)
    .filter(([k, s]) => {
      if (regionFilter !== 'all' && !(s.regions || []).includes(regionFilter)) return false;
      if (filterMode !== 'all' && s.category !== filterMode.replace('vegetables','vegetable').replace('herbs','herb').replace('trees','tree').replace('shrubs','shrub')) return false;
      if (search && !spName(s).toLowerCase().includes(search) && !k.includes(search)) return false;
      return true;
    })
    .sort((a, b) => a[1].name.localeCompare(b[1].name));

  for (const [k, s] of entries) {
    const item = document.createElement('div');
    item.className = 'species-item' + (k === selectedKey ? ' active' : '');
    item.dataset.key = k;
    item.innerHTML = `<span class="icon">${s.icon || '🌱'}</span> <span>${spName(s)}</span>` +
      `<span class="cat">${catName(s.category)}</span>`;
    item.onclick = function() {
      selectedKey = k;
      renderSidebar();
      renderMain();
      closeMobileSidebar();
    };
    list.appendChild(item);
  }
}

function renderMain() {
  const main = document.getElementById('content');
  if (!selectedKey || !SPECIES[selectedKey]) {
    main.innerHTML = '<div class="empty-state"><div class="big">🌿</div><div class="msg">' + tt('emptyState') + '</div></div>';
    return;
  }

  const s = SPECIES[selectedKey];
  const g = s.guild || { gives: [], needs: [], companions: [], antagonists: [], accumulates: [], rootForm: '', rootZone: '' };

  // Compute unmet needs
  const unmetNeeds = [];
  if (g.needs) {
    for (const need of g.needs) {
      const matchingGives = NEEDS_TO_GIVES[need] || [];
      const met = Object.entries(SPECIES)
        .filter(([k]) => k !== selectedKey)
        .some(([k, other]) => other.guild && other.guild.gives && matchingGives.some(mg => other.guild.gives.includes(mg)));
      if (!met) unmetNeeds.push(need);
    }
  }

  // Compute all companion scores
  const scores = Object.entries(SPECIES)
    .filter(([k]) => k !== selectedKey)
    .map(([k, other]) => {
      const result = computeScore(selectedKey, k);
      return { key: k, name: other.name, nameNL: other.nameNL, icon: other.icon || '🌱', category: other.category, ...result };
    })
    .sort((a, b) => b.score - a.score);

  let html = `
    <div class="profile">
      <h2>${s.icon || '🌱'} ${spName(s)}</h2>
      <div class="sub">${s.italian || ''} ${s.latin ? '· <em>' + s.latin + '</em>' : ''} · ${s.familyNL || ''} (${s.family || ''})</div>
  `;

  // Gives tags
  if (g.gives && g.gives.length) {
    html += '<div class="tag-row gives-tags"><div class="label">' + tt('givesTo') + '</div>';
    for (const g_val of g.gives) html += `<span class="tag">${glbl(g_val)}</span>`;
    html += '</div>';
  }

  // Needs tags
  if (g.needs && g.needs.length) {
    html += '<div class="tag-row needs-tags"><div class="label">' + tt('needsFrom') + '</div>';
    for (const n of g.needs) html += `<span class="tag">${nlbl(n)}</span>`;
    html += '</div>';
  }

  // Accumulates
  if (g.accumulates && g.accumulates.length) {
    html += '<div class="tag-row mineral-tags"><div class="label">' + tt('accumulates') + '</div>';
    for (const m of g.accumulates) html += `<span class="tag">${MINERAL_LABELS[m] || m} — ${LANG === 'nl' ? ({nitrogen:'stikstof',potassium:'kalium',calcium:'calcium',phosphorus:'fosfor',iron:'ijzer',magnesium:'magnesium',silica:'silicium',copper:'koper',sulfur:'zwavel'}[m] || m) : m}</span>`;
    html += '</div>';
  }

  // Root form
  if (g.rootForm || g.rootZone) {
    html += '<div class="tag-row"><div class="label">' + tt('rootSystem') + '</div>';
    if (g.rootForm) html += `<span class="root-tag">${rflbl(g.rootForm)}</span>`;
    if (g.rootZone) html += `<span class="root-tag">${tt('zone')}: ${g.rootZone}</span>`;
    html += '</div>';
  }

  // Unmet needs
  if (unmetNeeds.length) {
    html += `<div class="unmet-box"><div class="title">${tt('unmetTitle')}</div>`;
    html += `<div class="desc">${tt('unmetNeeds')}: <strong>${unmetNeeds.map(n => nlbl(n)).join(', ')}</strong><br>`;
    html += `${tt('unmetConsider')} ${unmetNeeds.map(n => (NEEDS_TO_GIVES[n] || []).map(glbl).join(', ')).join(', ')}</div></div>`;
  }

  html += '</div>';

  // Legend
  html += '<div class="legend">';
  html += '<div class="item"><div class="swatch" style="background:#2ecc71"></div>' + tt('legendStrong') + '</div>';
  html += '<div class="item"><div class="swatch" style="background:var(--gold)"></div>' + tt('legendModerate') + '</div>';
  html += '<div class="item"><div class="swatch" style="background:var(--danger)"></div>' + tt('legendAntagonist') + '</div>';
  html += '<div class="item"><div class="swatch" style="background:rgba(255,255,255,0.1)"></div>' + tt('legendNeutral') + '</div>';
  html += '</div>';

  // Companion table
  html += '<div class="companion-table-wrap"><table class="companion-table"><thead><tr><th>' + tt('thSpecies') + '</th><th>' + tt('thScore') + '</th><th>' + tt('thWhy') + '</th></tr></thead><tbody>';

  const top = scores.filter(s => s.score > 0 || s.isAntagonist).slice(0, 40);
  const antagonists = scores.filter(s => s.isAntagonist);
  const rest = scores.filter(s => s.score <= 0 && !s.isAntagonist);

  if (top.length === 0 && antagonists.length === 0) {
    html += '<tr><td colspan="3" style="text-align:center;color:var(--text2);padding:30px;">' + tt('noGuild') + '</td></tr>';
  } else {
    for (const sc of top) {
      let scoreClass = sc.score >= 8 ? 'high' : sc.score >= 4 ? 'med' : 'low';
      if (sc.isAntagonist) scoreClass = 'antagonist';
      html += `<tr>
        <td>${sc.icon} ${LANG === 'nl' && sc.nameNL ? sc.nameNL : sc.name} <span style="font-size:0.75em;color:rgba(255,255,255,0.3)">(${catName(sc.category)})</span></td>
        <td class="score-cell ${scoreClass}">${sc.isAntagonist ? '⚠️' : '+' + sc.score}</td>
        <td><div class="reason-tags">`;
      for (const r of sc.reasons.slice(0, 4)) {
        html += `<span class="rt ${r.type}">${r.text.trim()}</span>`;
      }
      if (sc.reasons.length > 4) {
        html += `<span class="rt gives" style="cursor:pointer;text-decoration:underline" onclick="this.parentElement.querySelectorAll('.rt.hidden-reason').forEach(e=>e.style.display='inline-flex');this.style.display='none'">+${sc.reasons.length - 4} ${tt('more')}</span>`;
        for (const r of sc.reasons.slice(4)) {
          html += `<span class="rt ${r.type} hidden-reason" style="display:none">${r.text.trim()}</span>`;
        }
      }
      html += '</div></td></tr>';
    }
  }

  html += '</tbody></table></div>';

  // Antagonists section (if any and not already shown)
  const shownAntagonists = top.filter(s => s.isAntagonist).map(s => s.key);
  const hiddenAnt = antagonists.filter(a => !shownAntagonists.includes(a.key));
  if (hiddenAnt.length) {
    html += '<div style="margin-top:20px;padding:16px;border:1px solid rgba(192,57,43,0.3);border-radius:8px;background:rgba(192,57,43,0.05);">';
    html += '<div style="color:var(--danger);font-weight:bold;margin-bottom:8px;">' + tt('knownAntagonists') + '</div>';
    for (const a of hiddenAnt) {
      html += `<div>${a.icon} ${LANG === 'nl' && a.nameNL ? a.nameNL : a.name}</div>`;
    }
    html += '</div>';
  }

  main.innerHTML = html;
}

// ============ INIT ============
// Filter tabs
let regionFilter = 'all';

// Check URL param for region
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('region') === 'tuscany') regionFilter = 'tuscany';
else if (urlParams.get('region') === 'netherlands') regionFilter = 'netherlands';

document.addEventListener('DOMContentLoaded', function() {
  // Insert region filter
  const sidebar = document.querySelector('.sidebar');
  const regionBar = document.createElement('div');
  regionBar.style.cssText = 'display:flex;gap:4px;padding:0 14px 12px;';
  regionBar.innerHTML = `
    <button class="tab region-tab ${regionFilter==='all'?'active':''}" data-region="all">${tt('regAll')}</button>
    <button class="tab region-tab ${regionFilter==='tuscany'?'active':''}" data-region="tuscany">${tt('regTus')}</button>
    <button class="tab region-tab ${regionFilter==='netherlands'?'active':''}" data-region="netherlands">${tt('regNl')}</button>
  `;
  sidebar.querySelector('.search').after(regionBar);

  regionBar.querySelectorAll('.region-tab').forEach(t => {
    t.onclick = function(e) {
      e.stopPropagation();
      regionBar.querySelectorAll('.region-tab').forEach(tt => tt.classList.remove('active'));
      t.classList.add('active');
      regionFilter = t.dataset.region;
      renderSidebar();
    };
  });

  // Insert category filter tabs
  const tabs = document.createElement('div');
  tabs.style.cssText = 'display:flex;flex-wrap:wrap;gap:4px;padding:0 14px 12px;';
  tabs.innerHTML = `
    <button class="tab active" data-filter="all">${tt('all')}</button>
    <button class="tab" data-filter="trees">${tt('trees')}</button>
    <button class="tab" data-filter="shrubs">${tt('shrubs')}</button>
    <button class="tab" data-filter="vegetables">${tt('veg')}</button>
    <button class="tab" data-filter="herbs">${tt('herbs')}</button>
  `;
  sidebar.querySelector('.search').after(tabs);

  tabs.querySelectorAll('.tab').forEach(t => {
    t.onclick = function(e) {
      e.stopPropagation();
      tabs.querySelectorAll('.tab').forEach(tt => tt.classList.remove('active'));
      t.classList.add('active');
      filterMode = t.dataset.filter;
      renderSidebar();
    };
  });

  document.getElementById('search-input').oninput = renderSidebar;
  applyI18nGM();

  renderSidebar();
  renderMain();
});

// ============ MOBILE SIDEBAR ============
function openMobileSidebar() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('mobile-backdrop').classList.add('open');
}
function closeMobileSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('mobile-backdrop').classList.remove('open');
}
</script>
